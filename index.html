<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="เกมปลูกผัก ขายของ ขยายฟาร์ม เล่นง่าย เล่นฟรีบนเบราว์เซอร์">
<meta name="theme-color" content="#6BA33F">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%BB%3C/text%3E%3C/svg%3E">
<title>ฟาร์มสุขใจ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F3EEDC; --card:#FFFDF6; --ink:#3B2F1E; --muted:#7D6E57; --line:#E2D8BE;
  --accent:#5E9A34; --accent-ink:#FFFFFF; --gold:#C98A12; --bad:#C0463A;
  --soil:#9B6B43; --soil-dark:#7A5131; --sky:#CFE8F2;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1C1A14; --card:#29261D; --ink:#F1EAD8; --muted:#B3A68A; --line:#3E3929;
  --accent:#86C25A; --accent-ink:#14200A; --gold:#F0B53C; --bad:#F07A6C;
  --soil:#6E4C30; --soil-dark:#553922; --sky:#1E2B33; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1A14; --card:#29261D; --ink:#F1EAD8; --muted:#B3A68A; --line:#3E3929;
  --accent:#86C25A; --accent-ink:#14200A; --gold:#F0B53C; --bad:#F07A6C;
  --soil:#6E4C30; --soil-dark:#553922; --sky:#1E2B33; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Mitr",system-ui,sans-serif;font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;overflow-x:hidden;padding-bottom:84px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{cursor:not-allowed;opacity:.45}

/* status bar */
.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;align-items:center}
.coins{font-weight:600;font-size:18px;color:var(--gold);white-space:nowrap}
.lvl{flex:1;min-width:0}
.lvl-row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}

main{max-width:640px;margin:0 auto;padding:16px}
h2{font-size:18px;font-weight:600;margin:0 0 10px}
.hint{color:var(--muted);font-size:13px;margin:0 0 12px}
.panel{display:none}.panel.on{display:block}

/* seed bar */
.seeds{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;scrollbar-width:thin}
.seed{flex:0 0 auto;min-width:76px;padding:8px 6px;border-radius:14px;background:var(--card);border:2px solid var(--line);text-align:center}
.seed .e{font-size:26px;display:block;line-height:1.1}
.seed small{display:block;font-size:12px;color:var(--muted)}
.seed.sel{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.seed.locked{opacity:.5}

/* farm */
.farm{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:var(--sky);padding:10px;border-radius:18px}
.plot{position:relative;aspect-ratio:1;border-radius:12px;background:var(--soil);box-shadow:inset 0 -5px 0 var(--soil-dark);display:flex;align-items:center;justify-content:center;font-size:34px;overflow:hidden}
.plot .p{position:absolute;left:6px;right:6px;bottom:8px;height:5px;border-radius:9px;background:rgba(0,0,0,.25);overflow:hidden}
.plot .p i{display:block;height:100%;background:#FFE27A;width:0}
.plot .t{position:absolute;top:3px;right:6px;font-size:11px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.plot.ready{animation:bob 1s ease-in-out infinite}
.plot.ready::after{content:"เก็บ!";position:absolute;top:3px;left:6px;font-size:11px;color:#fff;background:var(--accent);padding:0 5px;border-radius:6px}
@keyframes bob{50%{transform:translateY(-3px)}}
.plot.buy{background:transparent;box-shadow:none;border:2px dashed var(--muted);font-size:12px;line-height:1.25;color:var(--muted);flex-direction:column;text-align:center}
.plot.buy b{font-size:18px}
.row-btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

/* generic */
.btn{background:var(--accent);color:var(--accent-ink);padding:9px 14px;border-radius:12px;font-weight:500}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.item{display:flex;align-items:center;gap:10px}
.item .e{font-size:30px}
.item .info{flex:1;min-width:0}
.item .info small{color:var(--muted);display:block;font-size:12px}
.empty{color:var(--muted);text-align:center;padding:24px 0}
.order-need{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
.order-need span{background:var(--bg);padding:3px 8px;border-radius:9px;font-size:14px}
.order-need span.ok{outline:2px solid var(--accent)}
.reward{color:var(--gold);font-weight:600}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:8px 0 10px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;position:relative}
nav button .e{font-size:22px}
nav button.on{color:var(--accent);font-weight:600}
nav .dot{position:absolute;top:6px;left:55%;background:var(--bad);color:#fff;font-size:10px;border-radius:9px;padding:0 5px;display:none}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1}
@media (max-width:380px){.plot{font-size:28px}}
</style>
</head>
<body>
<header class="top">
  <div class="coins">🪙 <span id="coins">0</span></div>
  <div class="lvl">
    <div class="lvl-row"><span id="lvlText">เลเวล 1</span><span id="xpText">0/20</span></div>
    <div class="bar"><i id="xpBar"></i></div>
  </div>
</header>

<main>
  <section class="panel on" id="p-farm">
    <h2>🌻 ฟาร์มของฉัน</h2>
    <p class="hint">เลือกเมล็ด แล้วแตะแปลงว่างเพื่อปลูก · พืชโตแล้วแตะเพื่อเก็บ</p>
    <div class="seeds" id="seeds"></div>
    <div class="farm" id="farm"></div>
    <div class="row-btns">
      <button class="btn" id="harvestAll">🧺 เก็บทั้งหมด</button>
      <button class="btn ghost" id="plantAll">🌱 ปลูกทุกแปลงว่าง</button>
    </div>
  </section>

  <section class="panel" id="p-market">
    <h2>📦 ออเดอร์ลูกค้า</h2>
    <p class="hint">ส่งของครบตามออเดอร์ ได้เงินมากกว่าขายปกติ</p>
    <div id="orders"></div>
    <h2 style="margin-top:18px">🛒 ขายในตลาด</h2>
    <div id="inv"></div>
  </section>

  <section class="panel" id="p-up">
    <h2>🔧 อัปเกรด</h2>
    <div id="ups"></div>
    <h2 style="margin-top:18px">⚙️ ตั้งค่า</h2>
    <div class="card">
      <div class="row-btns" style="margin:0">
        <button class="btn ghost sm" id="themeBtn">🌓 สลับธีม</button>
        <button class="btn ghost sm" id="resetBtn">🗑️ เริ่มเกมใหม่</button>
      </div>
    </div>
  </section>
</main>

<nav>
  <button class="on" data-tab="farm"><span class="e">🌾</span>ฟาร์ม</button>
  <button data-tab="market"><span class="e">🏪</span>ตลาด<span class="dot" id="orderDot"></span></button>
  <button data-tab="up"><span class="e">⭐</span>อัปเกรด</button>
</nav>
<div class="toast" id="toast"></div>

<script>
"use strict";
const CROPS = [
  {id:"lettuce",    name:"ผักกาด",       e:"🥬", seed:5,   time:10,  sell:12,  xp:1,  lvl:1},
  {id:"carrot",     name:"แครอท",        e:"🥕", seed:10,  time:20,  sell:25,  xp:2,  lvl:1},
  {id:"corn",       name:"ข้าวโพด",      e:"🌽", seed:20,  time:40,  sell:50,  xp:3,  lvl:2},
  {id:"tomato",     name:"มะเขือเทศ",    e:"🍅", seed:35,  time:60,  sell:85,  xp:5,  lvl:3},
  {id:"strawberry", name:"สตรอว์เบอร์รี", e:"🍓", seed:60,  time:90,  sell:150, xp:8,  lvl:4},
  {id:"pumpkin",    name:"ฟักทอง",       e:"🎃", seed:100, time:150, sell:260, xp:12, lvl:5},
  {id:"watermelon", name:"แตงโม",        e:"🍉", seed:180, time:240, sell:460, xp:20, lvl:6},
];
const CROP = Object.fromEntries(CROPS.map(c => [c.id, c]));
const START_PLOTS = 6, MAX_PLOTS = 16, MAX_ORDERS = 3, SAVE_KEY = "happyfarm-v1";

const newState = () => ({
  coins: 40, xp: 0, level: 1, sel: "lettuce",
  plots: Array.from({length: START_PLOTS}, () => ({c: null, at: 0})),
  inv: {}, up: {speed: 0, price: 0}, orders: [],
});
let S = load() || newState();

function load(){
  try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); return s && Array.isArray(s.plots) ? s : null; }
  catch { return null; }
}
function save(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch {} }

const $ = id => document.getElementById(id);
const fmt = n => Math.floor(n).toLocaleString("th-TH");
const xpNeed = l => Math.round(20 * Math.pow(l, 1.5));
const growTime = c => CROP[c].time * (1 - 0.1 * S.up.speed) * 1000;
const sellPrice = c => Math.round(CROP[c].sell * (1 + 0.1 * S.up.price));
const plotCost = () => Math.round(100 * Math.pow(1.6, S.plots.length - START_PLOTS));
const upCost = (k) => Math.round((k === "speed" ? 150 : 200) * Math.pow(2, S.up[k]));
const unlocked = () => CROPS.filter(c => c.lvl <= S.level);
const isReady = p => p.c && Date.now() - p.at >= growTime(p.c);

let toastTimer;
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), 1600);
}

function addXp(n){
  S.xp += n;
  while (S.xp >= xpNeed(S.level)) {
    S.xp -= xpNeed(S.level); S.level++;
    const nu = CROPS.filter(c => c.lvl === S.level).map(c => c.e + " " + c.name).join(", ");
    toast(`🎉 เลเวล ${S.level}!` + (nu ? ` ปลดล็อก ${nu}` : ""));
    renderSeeds();
  }
}

/* ---------- actions ---------- */
function plant(i, quiet){
  const p = S.plots[i], c = CROP[S.sel];
  if (p.c) return false;
  if (S.coins < c.seed){ if (!quiet) toast("เงินไม่พอซื้อเมล็ด"); return false; }
  S.coins -= c.seed; p.c = c.id; p.at = Date.now();
  return true;
}
function harvest(i){
  const p = S.plots[i];
  if (!isReady(p)) return false;
  S.inv[p.c] = (S.inv[p.c] || 0) + 1;
  addXp(CROP[p.c].xp);
  p.c = null; p.at = 0;
  return true;
}
function tapPlot(i){
  const p = S.plots[i];
  if (!p.c){ if (plant(i)) changed(); }
  else if (isReady(p)){ const c = CROP[p.c]; harvest(i); toast(`เก็บ ${c.e} ${c.name} +${c.xp} XP`); changed(); }
  else {
    const left = Math.ceil((growTime(p.c) - (Date.now() - p.at)) / 1000);
    toast(`${CROP[p.c].e} ${CROP[p.c].name} อีก ${left} วินาที`);
  }
}
function buyPlot(){
  const cost = plotCost();
  if (S.plots.length >= MAX_PLOTS || S.coins < cost) return toast("เงินไม่พอ");
  S.coins -= cost; S.plots.push({c: null, at: 0});
  toast("ขยายแปลงใหม่แล้ว 🌱"); renderFarm(true); changed();
}
function sell(id, n){
  n = Math.min(n, S.inv[id] || 0); if (!n) return;
  S.inv[id] -= n; if (!S.inv[id]) delete S.inv[id];
  const got = sellPrice(id) * n; S.coins += got;
  toast(`ขาย ${CROP[id].e} ×${n} ได้ ${fmt(got)} 🪙`); changed();
}
function sellAll(){
  let got = 0;
  for (const id in S.inv){ got += sellPrice(id) * S.inv[id]; }
  if (!got) return;
  S.inv = {}; S.coins += got; toast(`ขายทั้งหมดได้ ${fmt(got)} 🪙`); changed();
}

/* ---------- orders ---------- */
const NAMES = ["ป้าแดง","ลุงสม","น้องมิว","ร้านข้าวมันไก่","ครัวคุณยาย","แม่ค้าตลาดเช้า","เชฟต้น","คาเฟ่ริมทุ่ง"];
function makeOrder(){
  const pool = unlocked(), kinds = Math.min(pool.length, 1 + Math.floor(Math.random() * 3));
  const picks = [...pool].sort(() => Math.random() - .5).slice(0, kinds);
  const need = {}; let value = 0, xp = 0;
  for (const c of picks){ const q = 2 + Math.floor(Math.random() * 4); need[c.id] = q; value += c.sell * q; xp += c.xp * q; }
  return {who: NAMES[Math.floor(Math.random() * NAMES.length)], need, coins: Math.round(value * 1.6), xp: Math.round(xp * 1.5)};
}
function fillOrders(){ while (S.orders.length < MAX_ORDERS) S.orders.push(makeOrder()); }
const canDeliver = o => Object.entries(o.need).every(([id, q]) => (S.inv[id] || 0) >= q);
function deliver(i){
  const o = S.orders[i]; if (!canDeliver(o)) return;
  for (const [id, q] of Object.entries(o.need)){ S.inv[id] -= q; if (!S.inv[id]) delete S.inv[id]; }
  S.coins += o.coins; addXp(o.xp);
  S.orders.splice(i, 1); fillOrders();
  toast(`ส่งของให้${o.who}แล้ว +${fmt(o.coins)} 🪙`); changed();
}
function skipOrder(i){ S.orders.splice(i, 1); fillOrders(); changed(); }

/* ---------- upgrades ---------- */
const UPS = [
  {k:"speed", e:"💧", name:"สปริงเกอร์", desc: l => `พืชโตเร็วขึ้น ${l*10}%`, max:5},
  {k:"price", e:"🪧", name:"ป้ายร้านสวย", desc: l => `ขายแพงขึ้น ${l*10}%`, max:5},
];
function buyUp(k){
  const u = UPS.find(x => x.k === k), cost = upCost(k);
  if (S.up[k] >= u.max || S.coins < cost) return toast("เงินไม่พอ");
  S.coins -= cost; S.up[k]++; toast(`อัปเกรด${u.name}แล้ว!`); changed();
}

/* ---------- render ---------- */
function renderTop(){
  $("coins").textContent = fmt(S.coins);
  $("lvlText").textContent = "เลเวล " + S.level;
  $("xpText").textContent = `${S.xp}/${xpNeed(S.level)} XP`;
  $("xpBar").style.width = (S.xp / xpNeed(S.level) * 100) + "%";
  const n = S.orders.filter(canDeliver).length, d = $("orderDot");
  d.style.display = n ? "block" : "none"; d.textContent = n;
}
function renderSeeds(){
  $("seeds").innerHTML = CROPS.map(c => {
    const lock = c.lvl > S.level;
    return `<button class="seed ${c.id === S.sel ? "sel" : ""} ${lock ? "locked" : ""}" data-seed="${c.id}" ${lock ? "disabled" : ""}>
      <span class="e">${lock ? "🔒" : c.e}</span>${c.name}
      <small>${lock ? "เลเวล " + c.lvl : "🪙" + c.seed + " · " + c.time + "วิ"}</small></button>`;
  }).join("");
}
let plotEls = [];
function renderFarm(rebuild){
  const farm = $("farm");
  if (rebuild || plotEls.length !== S.plots.length){
    farm.innerHTML = S.plots.map((_, i) => `<button class="plot" data-plot="${i}"></button>`).join("") +
      (S.plots.length < MAX_PLOTS ? `<button class="plot buy" id="buyPlot"><b>＋</b>แปลงใหม่<br>🪙<span id="plotCost"></span></button>` : "");
    plotEls = [...farm.querySelectorAll("[data-plot]")];
  }
  const now = Date.now();
  S.plots.forEach((p, i) => {
    const el = plotEls[i];
    let html = "", ready = false;
    if (p.c){
      const f = Math.min(1, (now - p.at) / growTime(p.c));
      ready = f >= 1;
      if (ready) html = CROP[p.c].e;
      else {
        const left = Math.ceil((growTime(p.c) - (now - p.at)) / 1000);
        html = (f < .5 ? "🌱" : "🌿") + `<span class="t">${left}วิ</span><span class="p"><i style="width:${f*100}%"></i></span>`;
      }
    }
    if (el._h !== html){ el.innerHTML = html; el._h = html; }
    el.classList.toggle("ready", ready);
    el.setAttribute("aria-label", p.c ? CROP[p.c].name + (ready ? " พร้อมเก็บ" : " กำลังโต") : "แปลงว่าง");
  });
  const pc = $("plotCost"); if (pc) pc.textContent = fmt(plotCost());
}
function renderMarket(){
  $("orders").innerHTML = S.orders.map((o, i) => {
    const ok = canDeliver(o);
    return `<div class="card"><div class="item"><div class="info"><b>${o.who}</b>
      <small>รางวัล <span class="reward">🪙${fmt(o.coins)}</span> · ⭐${o.xp} XP</small></div></div>
      <div class="order-need">${Object.entries(o.need).map(([id, q]) =>
        `<span class="${(S.inv[id]||0) >= q ? "ok" : ""}">${CROP[id].e} ${S.inv[id]||0}/${q}</span>`).join("")}</div>
      <div class="row-btns" style="margin:0"><button class="btn sm" data-deliver="${i}" ${ok ? "" : "disabled"}>ส่งของ</button>
      <button class="btn ghost sm" data-skip="${i}">ข้าม</button></div></div>`;
  }).join("");
  const ids = Object.keys(S.inv);
  $("inv").innerHTML = ids.length ? ids.map(id => `<div class="card item"><span class="e">${CROP[id].e}</span>
      <div class="info">${CROP[id].name} ×${S.inv[id]}<small>ชิ้นละ 🪙${sellPrice(id)}</small></div>
      <button class="btn ghost sm" data-sell="${id}" data-n="1">ขาย 1</button>
      <button class="btn sm" data-sell="${id}" data-n="999999">ขายหมด</button></div>`).join("") +
      `<button class="btn" id="sellAll" style="width:100%">💰 ขายทุกอย่าง</button>`
    : `<div class="empty">ยังไม่มีผลผลิต ไปปลูกผักก่อนนะ 🌱</div>`;
}
function renderUps(){
  $("ups").innerHTML = UPS.map(u => {
    const l = S.up[u.k], max = l >= u.max;
    return `<div class="card item"><span class="e">${u.e}</span><div class="info">${u.name} (${l}/${u.max})
      <small>${u.desc(l)}${max ? "" : " → " + u.desc(l + 1)}</small></div>
      <button class="btn sm" data-up="${u.k}" ${max ? "disabled" : ""}>${max ? "สูงสุด" : "🪙" + fmt(upCost(u.k))}</button></div>`;
  }).join("");
}
function changed(){ renderTop(); renderFarm(); renderMarket(); renderUps(); save(); }

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.plot !== undefined) return tapPlot(+t.dataset.plot);
  if (t.dataset.seed){ S.sel = t.dataset.seed; renderSeeds(); save(); return; }
  if (t.id === "buyPlot") return buyPlot();
  if (t.dataset.sell) return sell(t.dataset.sell, +t.dataset.n);
  if (t.id === "sellAll") return sellAll();
  if (t.dataset.deliver !== undefined) return deliver(+t.dataset.deliver);
  if (t.dataset.skip !== undefined) return skipOrder(+t.dataset.skip);
  if (t.dataset.up) return buyUp(t.dataset.up);
  if (t.dataset.tab){
    document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b === t));
    document.querySelectorAll(".panel").forEach(p => p.classList.toggle("on", p.id === "p-" + t.dataset.tab));
    window.scrollTo(0, 0); return;
  }
});
$("harvestAll").onclick = () => {
  let n = 0; S.plots.forEach((_, i) => { if (harvest(i)) n++; });
  toast(n ? `เก็บได้ ${n} อย่าง 🧺` : "ยังไม่มีอะไรพร้อมเก็บ"); changed();
};
$("plantAll").onclick = () => {
  let n = 0; S.plots.forEach((_, i) => { if (plant(i, true)) n++; });
  toast(n ? `ปลูก${CROP[S.sel].name} ${n} แปลง` : (S.plots.some(p => !p.c) ? "เงินไม่พอซื้อเมล็ด" : "ไม่มีแปลงว่าง")); changed();
};
$("themeBtn").onclick = () => {
  const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem(SAVE_KEY + "-theme", r.dataset.theme); } catch {}
};
$("resetBtn").onclick = () => {
  if (!confirm("เริ่มเกมใหม่? ความคืบหน้าทั้งหมดจะหายไป")) return;
  S = newState(); fillOrders(); renderSeeds(); renderFarm(true); changed();
};
try { const th = localStorage.getItem(SAVE_KEY + "-theme"); if (th) document.documentElement.dataset.theme = th; } catch {}

/* ---------- start ---------- */
if (!CROP[S.sel]) S.sel = "lettuce";
S.up = Object.assign({speed: 0, price: 0}, S.up);
fillOrders(); renderSeeds(); renderFarm(true); changed();
setInterval(() => { renderFarm(); }, 250);
setInterval(save, 5000);
</script>
</body>
</html>
