<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="description" content="เกมสร้างเมือง วางถนน วางโซน แก้รถติด เล่นฟรีบนเบราว์เซอร์">
<meta name="theme-color" content="#1F2A36">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%99%EF%B8%8F%3C/text%3E%3C/svg%3E">
<title>เมืองกริด</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#E9EEF2; --panel:#FFFFFF; --ink:#1C2733; --muted:#5F6E7E; --line:#D4DCE4;
  --accent:#2F6FD0; --accent-ink:#FFFFFF; --good:#2E8B57; --bad:#C2413A; --warn:#B7862A;
  --r:#4CAF50; --c:#3D8BE0; --i:#E2B227;
  --f:"Anuphan",system-ui,sans-serif; --num:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11171E; --panel:#1C2530; --ink:#E6EDF4; --muted:#93A2B3; --line:#2D3A48;
  --accent:#6FA4F2; --accent-ink:#0B1420; --good:#58C48A; --bad:#F07A70; --warn:#E3B34F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11171E; --panel:#1C2530; --ink:#E6EDF4; --muted:#93A2B3; --line:#2D3A48;
  --accent:#6FA4F2; --accent-ink:#0B1420; --good:#58C48A; --bad:#F07A70; --warn:#E3B34F; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block;background:#5E8C44}

.bar{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:12px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.stat{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.stat small{font-size:11px;color:var(--muted)}
.stat b{font-family:var(--num);font-size:15px;font-weight:600;white-space:nowrap}
.neg{color:var(--bad)}
.speed{display:flex;gap:2px;background:var(--bg);border-radius:10px;padding:2px}
.speed button{padding:4px 8px;border-radius:8px;font-size:13px}
.speed button.on{background:var(--accent);color:var(--accent-ink)}
.rci{display:flex;gap:4px;align-items:flex-end;height:34px;margin-left:auto}
.rci div{width:14px;height:100%;position:relative;background:var(--bg);border-radius:4px;overflow:hidden}
.rci i{position:absolute;left:0;right:0;bottom:50%;height:0}
.rci span{position:absolute;bottom:-1px;left:0;right:0;text-align:center;font-size:9px;font-weight:600;color:var(--ink);z-index:1}
.rci div::after{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px solid var(--muted);opacity:.5}

#hint{position:fixed;left:50%;transform:translateX(-50%);z-index:4;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 12px;font-size:13px;max-width:calc(100% - 32px);text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.12)}
#hint:empty{display:none}
#hint.warn{border-color:var(--bad);color:var(--bad)}

.tools{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:4px;padding:6px 8px;padding-bottom:max(6px,env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tools button{flex:1 0 auto;min-width:56px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 6px;border-radius:10px;font-size:11px;color:var(--muted)}
.tools button .e{font-size:20px;line-height:1.1}
.tools button.on{background:var(--bg);color:var(--ink);font-weight:600;box-shadow:inset 0 -3px 0 var(--accent)}
.tools .sep{flex:0 0 1px;background:var(--line);margin:4px 2px}
.tools button[data-tool="R"].on{box-shadow:inset 0 -3px 0 var(--r)}
.tools button[data-tool="C"].on{box-shadow:inset 0 -3px 0 var(--c)}
.tools button[data-tool="I"].on{box-shadow:inset 0 -3px 0 var(--i)}

.sheet{position:fixed;left:12px;right:12px;z-index:6;max-width:420px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:0 8px 30px rgba(0,0,0,.2);display:none}
.sheet.on{display:block}
.sheet h3{margin:0 0 8px;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.sheet .x{font-size:18px;padding:0 4px;color:var(--muted)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:3px 0;border-bottom:1px dashed var(--line);font-size:13px}
.kv:last-child{border:0}
.kv b{font-family:var(--num);font-weight:600}
.tax{display:grid;grid-template-columns:90px 1fr 44px;align-items:center;gap:8px;margin:6px 0}
.tax input{width:100%;accent-color:var(--accent)}
.tax b{font-family:var(--num);text-align:right}
.sec{font-size:12px;color:var(--muted);margin:12px 0 4px;font-weight:600}
.btn{background:var(--accent);color:var(--accent-ink);padding:7px 12px;border-radius:10px;font-weight:500;font-size:13px}
.btn.ghost{background:var(--bg);color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.sub{position:fixed;left:50%;transform:translateX(-50%);z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 10px;display:none;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 24px);box-shadow:0 4px 14px rgba(0,0,0,.12);font-size:13px}
.sub.on{display:flex}
.sub small{color:var(--muted);font-size:12px;width:100%;text-align:center}
.lanes{display:flex;gap:3px}
.lanes button{min-width:32px;padding:4px 0;border-radius:8px;background:var(--bg);font-family:var(--num);font-weight:600}
.lanes button.on{background:var(--accent);color:var(--accent-ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);z-index:9;background:var(--ink);color:var(--bg);padding:7px 14px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1}
@media (max-width:520px){.bar{gap:8px;padding-left:8px;padding-right:8px}.stat b{font-size:13px}.hide-sm{display:none}}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<header class="bar" id="bar">
  <div class="stat"><small>เงิน</small><b id="sMoney">0</b></div>
  <div class="stat"><small>ประชากร</small><b id="sPop">0</b></div>
  <div class="stat hide-sm"><small>เดินทางทัน</small><b id="sCommute">–</b></div>
  <div class="stat"><small id="sDate">ปี 1</small><b id="sDay">ม.1</b></div>
  <div class="speed" id="speed">
    <button data-speed="0" title="หยุด (Space)">⏸</button>
    <button data-speed="1" class="on" title="ปกติ">▶</button>
    <button data-speed="3" title="เร็ว">⏩</button>
  </div>
  <div class="rci" title="ดีมานด์ RCI: เมืองต้องการโซนไหนเพิ่ม">
    <div><i id="dR" style="background:var(--r)"></i><span>R</span></div>
    <div><i id="dC" style="background:var(--c)"></i><span>C</span></div>
    <div><i id="dI" style="background:var(--i)"></i><span>I</span></div>
  </div>
</header>
<div id="hint"></div>

<nav class="tools" id="tools">
  <button data-tool="pan" class="on"><span class="e">✋</span>เลื่อน/ดู</button>
  <button data-tool="road"><span class="e">🛣️</span>ถนน</button>
  <button data-tool="R"><span class="e">🏠</span>ที่อยู่</button>
  <button data-tool="C"><span class="e">🏪</span>พาณิชย์</button>
  <button data-tool="I"><span class="e">🏭</span>อุตสาห.</button>
  <button data-tool="lane+"><span class="e">➕</span>เพิ่มเลน</button>
  <button data-tool="lane-"><span class="e">➖</span>ลดเลน</button>
  <button data-tool="bull"><span class="e">🧹</span>รื้อถอน</button>
  <span class="sep"></span>
  <button id="trafficBtn"><span class="e">🚦</span>จราจร</button>
  <button id="budgetBtn"><span class="e">💰</span>งบประมาณ</button>
</nav>

<div class="sub" id="sub">
  <span>จำนวนเลน</span>
  <div class="lanes" id="laneSel"></div>
  <small id="laneInfo"></small>
</div>
<div class="sheet" id="info"></div>
<div class="sheet" id="budget">
  <h3>💰 งบประมาณเมือง <button class="x" data-close="budget">✕</button></h3>
  <div class="sec">อัตราภาษี (สูงไป ดีมานด์ลด)</div>
  <div class="tax"><span>🏠 ที่อยู่</span><input type="range" min="0" max="20" data-tax="r"><b id="tR"></b></div>
  <div class="tax"><span>🏪 พาณิชย์</span><input type="range" min="0" max="20" data-tax="c"><b id="tC"></b></div>
  <div class="tax"><span>🏭 อุตสาห.</span><input type="range" min="0" max="20" data-tax="i"><b id="tI"></b></div>
  <div class="sec">ต่อเดือน (ประมาณ)</div>
  <div id="bStats"></div>
  <div class="row">
    <button class="btn ghost" id="themeBtn">🌓 สลับธีม</button>
    <button class="btn ghost" id="newBtn">🗺️ เริ่มเมืองใหม่</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ================= constants ================= */
const W = 64, H = 44, N = W * H, TS = 20;
const LANE_COST = 30, BRIDGE_LANE_COST = 200, BULL_COST = 10, NARROW_COST = 10;  // per lane per tile
const LANE_UPKEEP = 0.25, BRIDGE_LANE_UPKEEP = 1.2;    // per lane per day
const LANE_CAP = 80, TURN_LANE_CAP = 30, SOI_CAP = 50; // trip units (LANE_CAP = one lane each way)
const JUNCTION_FACTOR = .75;                            // signalised junctions lose capacity
const MAX_LANES = 6, HWY_LANES = 4;
// capacity of a road tile with L lanes (L odd & >1 = centre turn lane)
const laneCap = L => L <= 1 ? SOI_CAP : Math.floor(L / 2) * LANE_CAP + (L % 2 ? TURN_LANE_CAP : 0);
const perDir = L => L <= 1 ? 1 : Math.floor(L / 2);
const laneDesc = L => L <= 1 ? "1 เลน (ซอย สวนกันได้)" : L % 2 ? `${L} เลน (ไป ${perDir(L)} / กลับ ${perDir(L)} + เลนกลางเลี้ยว)` : `${L} เลน (ไป ${perDir(L)} / กลับ ${perDir(L)})`;
const MAX_COMMUTE = 80;                                 // travel-time units
const RES  = [0, 6, 16, 36];                            // residents per R level
const JOBC = [0, 4, 10, 22];                            // jobs per C level
const JOBI = [0, 6, 14, 28];                            // jobs per I level
const DAY_MS = 600, MONTH = 30, SAVE_KEY = "citygrid-v1";
const Z = {R: 1, C: 2, I: 3};
const ZCOL = {1: ["#9ED39A", "#5DB35A", "#3F9A3E", "#2C7B2E"], 2: ["#A6C9EE", "#5C9BE0", "#3B7DCB", "#2963AB"], 3: ["#F0DA92", "#E2B83A", "#C99A1C", "#A47C12"]};
const CAR_COLORS = ["#F4F4F4", "#E04B3C", "#2F6FD0", "#F2C230", "#333", "#9AA4AE", "#3BA676"];
const MAX_CARS = 400;

/* ================= utils ================= */
const $ = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString("th-TH");
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function mulberry32(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let toastT;
function toast(m){ const t = $("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 1800); }

/* ================= state ================= */
let G;               // saved state
let terr;            // 0 land, 1 water (from seed)
let conn, access;    // derived: road connected to outside, access road per tile
let flow = new Float32Array(N), load = new Float32Array(N), capArr = new Float32Array(N), junction = new Uint8Array(N);
let routes = new Map(), rList = [], jobList = [], rr = 0;
let cars = [];
let stats = {pop: 0, jobsC: 0, jobsI: 0, dR: 1, dC: .5, dI: 1, commute: 1, routed: 0, income: 0, expense: 0, roads: 0, bridges: 0, unemp: 0, unconnected: 0};
let netDirty = true;

function genTerrain(seed){
  const rnd = mulberry32(seed), t = new Uint8Array(N);
  let c = 30 + rnd() * 8;
  for (let y = 0; y < H; y++){
    c = clamp(c + (rnd() - .5) * 1.8, 26, 40);
    const w = 3 + (rnd() < .35 ? 1 : 0);
    for (let x = Math.round(c - w / 2); x < Math.round(c + w / 2); x++) t[y * W + x] = 1;
  }
  // a small lake
  const lx = 10 + Math.floor(rnd() * 8), ly = 4 + Math.floor(rnd() * 6);
  for (let y = -2; y <= 2; y++) for (let x = -3; x <= 3; x++) if (x * x / 9 + y * y / 4 <= 1) t[(ly + y) * W + lx + x] = 1;
  return t;
}
function newGame(){
  const seed = (Math.random() * 1e9) | 0;
  G = {seed, money: 30000, day: 0, tax: {r: 9, c: 9, i: 9}, road: new Uint8Array(N), lanes: new Uint8Array(N), zone: new Uint8Array(N), bld: new Uint8Array(N)};
  terr = genTerrain(seed);
  // highway connections to the outside world (locked = 2)
  for (const [y, x0, x1] of [[22, 0, 3], [12, W - 3, W]]) for (let x = x0; x < x1; x++){ G.road[y * W + x] = 2; G.lanes[y * W + x] = HWY_LANES; terr[y * W + x] = 0; }
  routes.clear(); cars = []; netDirty = true;
}
function save(){
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({...G, road: Array.from(G.road), lanes: Array.from(G.lanes), zone: Array.from(G.zone), bld: Array.from(G.bld)})); } catch {}
}
function loadGame(){
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (!s || !Array.isArray(s.road) || s.road.length !== N) return false;
    G = {...s, road: Uint8Array.from(s.road), zone: Uint8Array.from(s.zone), bld: Uint8Array.from(s.bld)};
    G.lanes = Array.isArray(s.lanes) && s.lanes.length === N ? Uint8Array.from(s.lanes) : G.road.map(r => r === 2 ? HWY_LANES : r ? 2 : 0);
    terr = genTerrain(G.seed);
    for (let i = 0; i < N; i++) if (G.road[i] === 2) terr[i] = 0;
    return true;
  } catch { return false; }
}

/* ================= network ================= */
const nbrs = i => { const x = i % W, y = (i / W) | 0, o = []; if (x > 0) o.push(i - 1); if (x < W - 1) o.push(i + 1); if (y > 0) o.push(i - W); if (y < H - 1) o.push(i + W); return o; };
const NB = Array.from({length: N}, (_, i) => nbrs(i));

function rebuildNetwork(){
  conn = new Uint8Array(N); access = new Int32Array(N).fill(-1);
  const q = [];
  for (let i = 0; i < N; i++) if (G.road[i] === 2){ conn[i] = 1; q.push(i); }
  while (q.length){ const i = q.pop(); for (const j of NB[i]) if (G.road[j] && !conn[j]){ conn[j] = 1; q.push(j); } }
  for (let i = 0; i < N; i++){
    if (G.road[i] || terr[i]) continue;
    for (const j of NB[i]) if (G.road[j] && conn[j]){ access[i] = j; break; }
    if (access[i] >= 0) continue;
    const x = i % W, y = (i / W) | 0;
    for (const [dx, dy] of [[2, 0], [-2, 0], [0, 2], [0, -2]]){
      const nx = x + dx, ny = y + dy; if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
      const j = ny * W + nx, m = (y + dy / 2) * W + x + dx / 2;
      if (G.road[j] && conn[j] && !G.road[m] && !terr[m]){ access[i] = j; break; }
    }
  }
  routes.clear(); rr = 0;
  cars = cars.filter(c => c.path.every(p => G.road[p]));
  netDirty = false;
  computeCaps();
}
function computeCaps(){
  for (let i = 0; i < N; i++){
    if (!G.road[i]){ capArr[i] = 0; junction[i] = 0; continue; }
    let n = 0; for (const j of NB[i]) if (G.road[j]) n++;
    junction[i] = n >= 3 ? 1 : 0;
    capArr[i] = laneCap(G.lanes[i] || 2) * (junction[i] ? JUNCTION_FACTOR : 1);
  }
  for (let i = 0; i < N; i++) load[i] = capArr[i] ? flow[i] / capArr[i] : 0;
}

// A* on road tiles, cost grows with congestion
const tileCost = i => { const l = load[i]; return 1 + (l > .7 ? 4 * (l - .7) * (l - .7) : 0) + (l > 1 ? 6 * (l - 1) : 0); };
const gS = new Float32Array(N), from = new Int32Array(N), stamp = new Uint32Array(N), closed = new Uint32Array(N);
let stampId = 0;
function astar(a, b){
  if (a === b) return [a];
  stampId++;
  const bx = b % W, by = (b / W) | 0, h = i => Math.abs(i % W - bx) + Math.abs(((i / W) | 0) - by);
  const heap = [[h(a), a]]; gS[a] = 0; stamp[a] = stampId; from[a] = -1;
  const push = n => { heap.push(n); let k = heap.length - 1; while (k > 0){ const p = (k - 1) >> 1; if (heap[p][0] <= heap[k][0]) break; [heap[p], heap[k]] = [heap[k], heap[p]]; k = p; } };
  const pop = () => { const top = heap[0], last = heap.pop(); if (heap.length){ heap[0] = last; let k = 0; for (;;){ const l = 2 * k + 1, r = l + 1; let m = k; if (l < heap.length && heap[l][0] < heap[m][0]) m = l; if (r < heap.length && heap[r][0] < heap[m][0]) m = r; if (m === k) break; [heap[m], heap[k]] = [heap[k], heap[m]]; k = m; } } return top; };
  while (heap.length){
    const [, i] = pop();
    if (closed[i] === stampId) continue;
    closed[i] = stampId;
    if (i === b){ const p = []; for (let k = b; k !== -1; k = from[k]) p.push(k); return p.reverse(); }
    for (const j of NB[i]){
      if (!G.road[j] || closed[j] === stampId) continue;
      const g = gS[i] + tileCost(j);
      if (stamp[j] !== stampId || g < gS[j]){ stamp[j] = stampId; gS[j] = g; from[j] = i; push([g + h(j), j]); }
    }
  }
  return null;
}

/* ================= simulation (one day) ================= */
function simDay(){
  if (netDirty) rebuildNetwork();
  const {road, zone, bld} = G;
  let pop = 0, jobsC = 0, jobsI = 0, roads = 0, bridges = 0, unconnected = 0, laneUp = 0;
  rList = []; jobList = [];
  const growable = [];
  for (let i = 0; i < N; i++){
    if (road[i]){ if (road[i] === 1){ terr[i] ? bridges++ : roads++; laneUp += G.lanes[i] * (terr[i] ? BRIDGE_LANE_UPKEEP : LANE_UPKEEP); } continue; }
    const z = zone[i]; if (!z) continue;
    const ok = access[i] >= 0;
    if (!ok) unconnected++;
    if (ok) growable.push(i);
    const l = bld[i]; if (!l) continue;
    if (z === 1){ pop += RES[l]; if (ok) rList.push(i); }
    else if (z === 2){ jobsC += JOBC[l]; if (ok) jobList.push(i); }
    else { jobsI += JOBI[l]; if (ok) jobList.push(i); }
  }
  for (const k of routes.keys()) if (zone[k] !== 1 || !bld[k] || access[k] < 0) routes.delete(k);

  // --- RCI demand ---
  const workers = pop * .5, jobs = jobsC + jobsI, tx = G.tax;
  const taxPen = r => (r - 9) * .06;
  const dR = clamp((jobs - workers + 30) / (30 + workers * .5) - taxPen(tx.r), -1, 1);
  const dC = clamp((pop * .15 + jobsI * .1 - jobsC + 5) / (10 + pop * .1) - taxPen(tx.c), -1, 1);
  const dI = clamp((workers * .7 - jobsI + 15) / (15 + workers * .5) - taxPen(tx.i), -1, 1);

  // --- trips: re-route a slice of homes each day (A*) ---
  if (rList.length){
    const n = Math.min(rList.length, 60);
    for (let k = 0; k < n; k++){
      const i = rList[rr++ % rList.length];
      const w = RES[bld[i]] * .3;
      if (!jobList.length){ routes.set(i, {nojob: true, w}); continue; }
      let best = -1, bd = 1e9;
      for (let s = 0; s < 4; s++){
        const j = jobList[(Math.random() * jobList.length) | 0];
        const d = Math.abs(j % W - i % W) + Math.abs(((j / W) | 0) - ((i / W) | 0));
        if (d < bd){ bd = d; best = j; }
      }
      const path = astar(access[i], access[best]);
      routes.set(i, path ? {path, w, dest: best} : {fail: true, w});
    }
  }
  // --- traffic: aggregate flow per road tile ---
  flow.fill(0);
  for (const r of routes.values()) if (r.path) for (const p of r.path) flow[p] += r.w;
  for (let i = 0; i < N; i++) load[i] = capArr[i] ? flow[i] / capArr[i] : 0;
  let okW = 0, totW = 0;
  for (const r of routes.values()){
    if (r.nojob) continue;
    totW += r.w;
    if (r.path){ let t = 0; for (const p of r.path) t += tileCost(p); r.time = t; r.ok = t <= MAX_COMMUTE; }
    else { r.time = Infinity; r.ok = false; }
    if (r.ok) okW += r.w;
  }
  const commute = totW ? okW / totW : 1;
  const growOK = commute >= .6;

  // --- growth / decline ---
  const D = {1: dR, 2: dC, 3: dI};
  const tries = 2 + Math.floor(growable.length / 25);
  for (let t = 0; t < tries && growable.length; t++){
    const i = growable[(Math.random() * growable.length) | 0];
    const z = zone[i], d = D[z], l = bld[i], r = routes.get(i);
    if (l === 0){
      if (growOK && d > 0 && Math.random() < .3 + d * .6) bld[i] = 1;
    } else if (l < 3){
      const need = l === 1 ? 120 : 600;
      const fine = z !== 1 || !r || r.ok || r.nojob;
      if (growOK && fine && d > .15 && pop >= need && Math.random() < d * .25) bld[i]++;
      else if (d < -.4 && Math.random() < .08) bld[i]--;
    } else if (d < -.5 && Math.random() < .05) bld[i]--;
    if (z === 1 && r && r.ok === false && l > 0 && Math.random() < .05) bld[i]--;
  }
  // buildings that lost their road slowly empty out
  if (unconnected) for (let k = 0; k < 6; k++){
    const i = (Math.random() * N) | 0;
    if (bld[i] && access[i] < 0) bld[i]--;
  }

  // --- money ---
  const income = (pop * tx.r + jobsC * tx.c * 1.3 + jobsI * tx.i * 1.3) / 100 * 1.6;
  const expense = laneUp;
  G.money += income - expense;
  G.day++;

  // --- cars ---
  for (const r of routes.values()){
    if (!r.path || r.path.length < 2 || cars.length >= MAX_CARS) continue;
    if (Math.random() < r.w * .035) cars.push({path: r.path, k: 0, t: Math.random() * .3, lane: (Math.random() * 3) | 0, col: CAR_COLORS[(Math.random() * CAR_COLORS.length) | 0]});
  }

  stats = {pop, jobsC, jobsI, dR, dC, dI, commute, routed: totW, income, expense, roads, bridges, unconnected,
    unemp: workers ? Math.max(0, workers - jobs) / workers : 0, zoned: growable.length + unconnected};
  updateHud();
}

const cv = $("cv"), ctx = cv.getContext("2d");
let dpr = 1, vw = 0, vh = 0, zoom = 1, cam = {x: 0, y: 0};
let tool = "pan", showTraffic = false, speed = 1, hover = null, drag = null, pinch = null;
const ptrs = new Map();

function resize(){
  dpr = Math.min(2, window.devicePixelRatio || 1); vw = innerWidth; vh = innerHeight;
  cv.width = vw * dpr; cv.height = vh * dpr;
  const bh = $("bar").offsetHeight;
  $("hint").style.top = (bh + 8) + "px";
  const th = $("tools").offsetHeight;
  $("toast").style.bottom = (th + 12) + "px";
  $("info").style.bottom = (th + 12) + "px";
  $("sub").style.bottom = (th + 8) + "px";
  $("budget").style.bottom = (th + 12) + "px";
}
function fitCamera(){
  const fit = Math.min(vw / (W * TS), (vh - 140) / (H * TS));
  zoom = clamp(Math.max(fit, .9), .35, 3);
  const cx = fit >= .9 ? W / 2 : 8, cy = fit >= .9 ? H / 2 : 22;
  cam.x = cx * TS - vw / 2 / zoom; cam.y = cy * TS - vh / 2 / zoom;
}
function setZoom(z, sx, sy){
  const wx = sx / zoom + cam.x, wy = sy / zoom + cam.y;
  zoom = clamp(z, .3, 3.5);
  cam.x = wx - sx / zoom; cam.y = wy - sy / zoom;
}
function clampCam(){
  const mw = W * TS, mh = H * TS, ww = vw / zoom, wh = vh / zoom, pad = 60;
  cam.x = ww >= mw + 2 * pad ? (mw - ww) / 2 : clamp(cam.x, -pad, mw - ww + pad);
  cam.y = wh >= mh + 2 * pad ? (mh - wh) / 2 : clamp(cam.y, -pad - 60, mh - wh + pad + 60);
}
const tileAt = (sx, sy) => ({x: clamp(Math.floor((sx / zoom + cam.x) / TS), 0, W - 1), y: clamp(Math.floor((sy / zoom + cam.y) / TS), 0, H - 1)});

cv.addEventListener("contextmenu", e => e.preventDefault());
cv.addEventListener("wheel", e => { e.preventDefault(); setZoom(zoom * Math.exp(-e.deltaY * .0015), e.clientX, e.clientY); }, {passive: false});
cv.addEventListener("pointerdown", e => {
  cv.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, {x: e.clientX, y: e.clientY});
  closeSheets();
  if (ptrs.size === 2){
    const [a, b] = [...ptrs.values()];
    pinch = {d: Math.hypot(a.x - b.x, a.y - b.y), zoom, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, cx: cam.x, cy: cam.y}; drag = null; return;
  }
  const pan = tool === "pan" || e.button === 1 || e.button === 2;
  drag = {pan, sx: e.clientX, sy: e.clientY, cx: cam.x, cy: cam.y, start: tileAt(e.clientX, e.clientY), moved: false};
  hover = drag.start;
});
cv.addEventListener("pointermove", e => {
  if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId, {x: e.clientX, y: e.clientY});
  if (pinch && ptrs.size >= 2){
    const [a, b] = [...ptrs.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    cam.x = pinch.cx; cam.y = pinch.cy; zoom = pinch.zoom;
    setZoom(pinch.zoom * d / pinch.d, pinch.mx, pinch.my);
    cam.x -= (mx - pinch.mx) / zoom; cam.y -= (my - pinch.my) / zoom;
    return;
  }
  hover = tileAt(e.clientX, e.clientY);
  if (!drag) return;
  if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 6) drag.moved = true;
  if (drag.pan){ cam.x = drag.cx - (e.clientX - drag.sx) / zoom; cam.y = drag.cy - (e.clientY - drag.sy) / zoom; }
});
function endPtr(e){
  ptrs.delete(e.pointerId);

  if (!drag) return;

  if (drag.pan){ if (!drag.moved && e.button !== 2) showInfo(end); }

  drag = null;
  if (e.pointerType !== "mouse") hover = null;
}

function lPath(a, b){
  const out = [], sx = Math.sign(b.x - a.x), sy = Math.sign(b.y - a.y);
  for (let x = a.x; ; x += sx){ out.push(a.y * W + x); if (x === b.x) break; }
  if (sy) for (let y = a.y + sy; ; y += sy){ out.push(y * W + b.x); if (y === b.y) break; }
  return out;
}
function rectTiles(a, b){
  const out = [];
  for (let y = Math.min(a.y, b.y); y <= Math.max(a.y, b.y); y++) for (let x = Math.min(a.x, b.x); x <= Math.max(a.x, b.x); x++) out.push(y * W + x);
  return out;
}
const laneUnit = i => terr[i] ? BRIDGE_LANE_COST : LANE_COST;
const isLineTool = t => t === "road" || t === "lane+" || t === "lane-";
// target lanes per tile for the current tool (null = untouched)
function laneTarget(i){
  const r = G.road[i], L = G.lanes[i];
  if (tool === "road") return r === 2 ? null : !r ? laneSel : L === laneSel ? null : laneSel;
  if (!r || r === 2) return null;
  if (tool === "lane+") return L < MAX_LANES ? L + 1 : null;
  if (tool === "lane-") return L > 1 ? L - 1 : null;
  return null;
}
function laneChangeCost(i, to){
  const from = G.road[i] ? G.lanes[i] : 0;
  return to > from ? (to - from) * laneUnit(i) : (from - to) * NARROW_COST;
}
function toolCost(a, b){
  if (isLineTool(tool)) return lPath(a, b).reduce((s, i) => { const t = laneTarget(i); return s + (t == null ? 0 : laneChangeCost(i, t)); }, 0);
  if (tool === "bull") return rectTiles(a, b).reduce((s, i) => s + ((G.road[i] === 1 || G.zone[i]) ? BULL_COST : 0), 0);
  return 0;
}
function applyTool(a, b){
  const cost = toolCost(a, b);
  if (cost > 0 && cost > G.money) return toast(`เงินไม่พอ (ต้องใช้ ${fmt(cost)})`);
  let n = 0;
  if (isLineTool(tool)){
    let built = 0;
    for (const i of lPath(a, b)){
      const t = laneTarget(i); if (t == null) continue;
      if (!G.road[i]){ G.road[i] = 1; G.zone[i] = 0; G.bld[i] = 0; built++; }
      G.lanes[i] = t; n++;
    }
    if (built) netDirty = true; else if (n) computeCaps();
    const what = tool === "road" ? (built ? `สร้างถนน ${laneSel} เลน ${n} ช่อง` : `ปรับเป็น ${laneSel} เลน ${n} ช่อง`) : tool === "lane+" ? `เพิ่ม 1 เลน ${n} ช่อง` : `ลด 1 เลน ${n} ช่อง`;
    if (n) toast(`${what} −${fmt(cost)}`); else toast(tool === "lane+" ? "ลากบนถนนที่มีอยู่ (สูงสุด 6 เลน)" : tool === "lane-" ? "ลากบนถนนที่มีอยู่ (ต่ำสุด 1 เลน)" : "ไม่มีอะไรเปลี่ยน");
  } else if (tool === "bull"){
    for (const i of rectTiles(a, b)){
      if (G.road[i] === 1){ G.road[i] = 0; n++; netDirty = true; }
      else if (G.zone[i]){ G.zone[i] = 0; G.bld[i] = 0; n++; }
    }
    if (n) toast(`รื้อ ${n} ช่อง −${fmt(cost)}`);
  } else if (Z[tool]){
    const z = Z[tool];
    for (const i of rectTiles(a, b)) if (!G.road[i] && !terr[i] && G.zone[i] !== z){ G.zone[i] = z; G.bld[i] = 0; n++; }
    if (n) netDirty = true;
  }
  G.money -= cost;
  updateHud();
}

const GRASS = ["#7CB259", "#7AB057", "#7EB45B", "#7BB158"];
const TREE = ["#3E7D32", "#4A8C3A", "#2F6B2A", "#5A9A3E"];

const WALL_R = ["#F3E8D2", "#EADBC2", "#F6F0E4", "#E5D4BC"];
const SIGN_C = ["#E0473A", "#F08A24", "#8D4FD1", "#1E9E8B", "#D93D7A"];

let T = 0; // seconds, for animation

function rect(x, y, w, h, c){ ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }

function circ(x, y, r, c){ ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill(); }
// pseudo-3D box: footprint (x,y,w,d), height h. Roof sits h px above the footprint, front wall shows below it.
function box(x, y, w, d, h, roof, wall){
  ctx.fillStyle = "rgba(20,30,20,.25)";
  ctx.beginPath(); ctx.moveTo(x + w, y - h + 1); ctx.lineTo(x + w + h * .45, y - h * .55 + 1); ctx.lineTo(x + w + h * .45, y + d + 1 - h * .1); ctx.lineTo(x + 1, y + d + 1.5); ctx.lineTo(x + w, y + d); ctx.closePath(); ctx.fill();
  rect(x, y + d - h, w, h, wall);
  rect(x, y + d - 1, w, 1, "rgba(0,0,0,.18)");
  rect(x, y - h, w, d, roof);
  rect(x, y - h, w, 1, "rgba(255,255,255,.35)");
}
function windows(x, y, w, rows, cols, ww, wh, gapY, col){
  const gx = (w - cols * ww) / (cols + 1);
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) rect(x + gx + c * (ww + gx), y + r * (wh + gapY), ww, wh, col);
}
function smoke(x, y, v, big){
  for (let k = 0; k < 3; k++){
    const p = (T * .35 + k / 3 + v) % 1;
    ctx.globalAlpha = .45 * (1 - p);
    circ(x + p * 5, y - p * (big ? 16 : 11), 1.6 + p * (big ? 4 : 3), "#E8EBEE");
  }
  ctx.globalAlpha = 1;
}
function tree(cx, cy, r, v){
  ctx.fillStyle = "rgba(20,40,20,.25)"; ctx.beginPath(); ctx.ellipse(cx + 2, cy + r * .6, r, r * .55, 0, 0, 6.2832); ctx.fill();
  rect(cx - .8, cy, 1.6, r * .7, "#6B4A2F");
  circ(cx, cy - r * .2, r, TREE[(v * 4) | 0]);
  circ(cx - r * .3, cy - r * .5, r * .45, "rgba(255,255,255,.16)");
}

function drawGround(i, x, y){
  const px = x * TS, py = y * TS, {road} = G;
  if (terr[i]){
    rect(px, py, TS, TS, "#3F86C6");
    const v = hash(i);
    if (v < .45){ ctx.fillStyle = "rgba(255,255,255,.22)"; const o = Math.sin(T * 1.2 + v * 9) * 2; ctx.fillRect(px + 3 + v * 8 + o, py + 6 + v * 8, 6, 1.2); }
    ctx.fillStyle = "#86C0E6";
    if (x > 0 && !terr[i - 1]) ctx.fillRect(px, py, 2, TS);
    if (x < W - 1 && !terr[i + 1]) ctx.fillRect(px + TS - 2, py, 2, TS);
    if (y > 0 && !terr[i - W]) ctx.fillRect(px, py, TS, 2);
    if (y < H - 1 && !terr[i + W]) ctx.fillRect(px, py + TS - 2, TS, 2);
    return;
  }
  const v = hash(i);
  rect(px, py, TS, TS, GRASS[(v * 4) | 0]);
  if (v > .5){ ctx.fillStyle = "rgba(40,90,30,.25)"; ctx.fillRect(px + v * 14, py + hash(i, 1) * 14, 2, 2); ctx.fillRect(px + hash(i, 2) * 14, py + v * 12 + 4, 2, 2); }
  // sandy shore
  ctx.fillStyle = "#E3D6A6";
  if (x > 0 && terr[i - 1] && !road[i - 1]) ctx.fillRect(px, py, 3, TS);
  if (x < W - 1 && terr[i + 1] && !road[i + 1]) ctx.fillRect(px + TS - 3, py, 3, TS);
  if (y > 0 && terr[i - W] && !road[i - W]) ctx.fillRect(px, py, TS, 3);
  if (y < H - 1 && terr[i + W] && !road[i + W]) ctx.fillRect(px, py + TS - 3, TS, 3);
  const z = G.zone[i];
  if (z && !road[i]){
    const served = access && access[i] >= 0;
    ctx.globalAlpha = served ? 1 : .45;
    rect(px + 1, py + 1, TS - 2, TS - 2, LOT[z]);
    if (!G.bld[i]){
      ctx.strokeStyle = LINE[z]; ctx.lineWidth = 1; ctx.setLineDash([2, 2]);
      ctx.strokeRect(px + 2.5, py + 2.5, TS - 5, TS - 5); ctx.setLineDash([]);
    }
    ctx.globalAlpha = 1;
  }
}

const swOf = L => L <= 1 ? 5 : L <= 2 ? 3.2 : L <= 4 ? 2 : 1.2;
function laneLine(x1, y1, x2, y2, col, dashed, w){
  ctx.strokeStyle = col; ctx.lineWidth = w || .8;
  ctx.setLineDash(dashed ? [3.5, 3] : []); ctx.lineDashOffset = dashed ? -(x1 + y1) : 0;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function drawRoad(i, x, y){
  const {road} = G, px = x * TS, py = y * TS, hw = road[i] === 2, br = terr[i], Ln = G.lanes[i] || 2;
  const cl = x > 0 && road[i - 1], cr = x < W - 1 && road[i + 1], cu = y > 0 && road[i - W], cd = y < H - 1 && road[i + W];
  const sw = swOf(Ln), rw = TS - 2 * sw, lw = rw / Ln;
  if (br){
    rect(px + 2, py + 4, TS, TS, "rgba(10,30,60,.35)");
    rect(px + TS / 2 - 2, py + TS / 2 - 2, 4, 4, "rgba(10,30,60,.45)");
  }
  rect(px, py, TS, TS, hw ? "#3A3F46" : br ? "#62686F" : "#4B5058");
  // sidewalks / bridge railings on open sides; curb corners on connected ones
  const swc = br ? "#D6D9DD" : hw ? "#596068" : "#C0C6CD";
  if (!cl) rect(px, py, sw, TS, swc);
  if (!cr) rect(px + TS - sw, py, sw, TS, swc);
  if (!cu) rect(px, py, TS, sw, swc);
  if (!cd) rect(px, py + TS - sw, TS, sw, swc);
  rect(px, py, sw, sw, swc); rect(px + TS - sw, py, sw, sw, swc); rect(px, py + TS - sw, sw, sw, swc); rect(px + TS - sw, py + TS - sw, sw, sw, swc);
  if (br){ ctx.fillStyle = "#8D949C"; for (let k = 2; k < TS; k += 5){ if (!cu) ctx.fillRect(px + k, py, 1, sw); if (!cd) ctx.fillRect(px + k, py + TS - sw, 1, sw); if (!cl) ctx.fillRect(px, py + k, sw, 1); if (!cr) ctx.fillRect(px + TS - sw, py + k, sw, 1); } }
  if (showTraffic && conn){
    const l = load[i];
    rect(px + sw + .5, py + sw + .5, rw - 1, rw - 1, l < .01 ? "rgba(150,160,170,.45)" : l < .7 ? "rgba(70,205,110,.85)" : l < 1 ? "rgba(245,190,40,.9)" : "rgba(235,60,50,.95)");
    return;
  }
  const n = (cl ? 1 : 0) + (cr ? 1 : 0) + (cu ? 1 : 0) + (cd ? 1 : 0);
  const horiz = !cu && !cd, vert = !cl && !cr && (cu || cd);
  const yellow = "#F2C230", white = "rgba(255,255,255,.85)";
  if (n >= 3){
    // zebra crossings + stop lines + traffic lights
    ctx.fillStyle = "rgba(255,255,255,.8)";
    for (let o = sw + .6; o < TS - sw - .8; o += 2.2){
      if (cl) ctx.fillRect(px + .5, py + o, 2.4, 1.3);
      if (cr) ctx.fillRect(px + TS - 2.9, py + o, 2.4, 1.3);
      if (cu) ctx.fillRect(px + o, py + .5, 1.3, 2.4);
      if (cd) ctx.fillRect(px + o, py + TS - 2.9, 1.3, 2.4);
    }
    const ph = Math.floor((T + hash(i) * 6) / 3) % 2;
    const hc = ph ? "#3DDC6B" : "#FF4A3D", vc = ph ? "#FF4A3D" : "#3DDC6B";
    for (const [ox, oy, c] of [[1.6, 1.6, vc], [TS - 1.6, TS - 1.6, vc], [TS - 1.6, 1.6, hc], [1.6, TS - 1.6, hc]]){ circ(px + ox, py + oy, 1.5, "#1B1F24"); circ(px + ox, py + oy, .9, c); }
    return;
  }
  if (horiz || vert || !n){
    // lane dividers along the axis
    const H_ = horiz || !n, a0 = H_ ? py + sw : px + sw;
    const ln = (pos, col, dashed, w) => H_ ? laneLine(px, pos, px + TS, pos, col, dashed, w) : laneLine(pos, py, pos, py + TS, col, dashed, w);
    for (let k = 1; k < Ln; k++){
      const pos = a0 + k * lw;
      const centre = Ln % 2 === 0 ? k === Ln / 2 : (k === (Ln - 1) / 2 || k === (Ln + 1) / 2);
      if (centre && Ln % 2 === 0){ ln(pos - .55, yellow, false, .6); ln(pos + .55, yellow, false, .6); }
      else if (centre) ln(pos, yellow, k === (Ln - 1) / 2 ? false : true, .7);
      else ln(pos, white, true, .6);
    }
    if (hw){ ln(a0 + .6, white, false, .5); ln(a0 + rw - .6, white, false, .5); }
    if (Ln % 2 && Ln > 1 && zoom * TS > 26){             // turn-lane arrows
      const c = a0 + rw / 2; ctx.fillStyle = "rgba(255,255,255,.75)";
      if (H_){ ctx.fillRect(px + 5, c - .3, 4, .6); ctx.fillRect(px + 11, c - .3, 4, .6); }
      else { ctx.fillRect(c - .3, py + 5, .6, 4); ctx.fillRect(c - .3, py + 11, .6, 4); }
    }
    ctx.setLineDash([]);
    return;
  }
  // bend: centre line follows the turn
  if (Ln >= 2){
    const cx = px + TS / 2, cy = py + TS / 2;
    ctx.strokeStyle = yellow; ctx.lineWidth = .8; ctx.setLineDash([]); ctx.beginPath();
    if (cl){ ctx.moveTo(px, cy); ctx.lineTo(cx, cy); } if (cr){ ctx.moveTo(px + TS, cy); ctx.lineTo(cx, cy); }
    if (cu){ ctx.moveTo(cx, py); ctx.lineTo(cx, cy); } if (cd){ ctx.moveTo(cx, py + TS); ctx.lineTo(cx, cy); }
    ctx.stroke();
  }
}

function drawBuilding(i, x, y){
  const z = G.zone[i], l = G.bld[i], v = hash(i, 7), px = x * TS, py = y * TS;
  if (z === 1){
    if (l === 1){
      rect(px + 2, py + 13, 16, 5, "#8CC46A");                         // yard
      tree(px + 16, py + 15, 2.6, v);
      const bx = px + 3, by = py + 6, w = 11, d = 9, h = 4;
      box(bx, by, w, d, h, ROOF_R[(v * 6) | 0], WALL_R[(v * 4) | 0]);
      rect(bx, by - h + d / 2, w, d / 2, "rgba(0,0,0,.18)");            // pitched-roof shade
      rect(bx, by - h + d / 2 - .5, w, 1, "rgba(255,255,255,.25)");
      rect(bx + 4.5, by + d - 3, 2, 3, "#7A4E2D");                     // door
      rect(bx + 1.5, by + d - 3, 2, 1.6, "#9FD0F0"); rect(bx + 7.5, by + d - 3, 2, 1.6, "#9FD0F0");
    } else if (l === 2){
      const bx = px + 2, by = py + 6, w = 16, d = 11, h = 8;
      box(bx, by, w, d, h, ROOF_R[(v * 6) | 0], WALL_R[(v * 4) | 0]);
      rect(bx, by - h, w, 2, "rgba(0,0,0,.15)");
      windows(bx, by + d - h + 1.5, w, 2, 4, 2, 2, 1.2, "#8EC6EC");
      rect(bx + w / 2 - 1, by + d - 2.5, 2, 2.5, "#6B4426");
    } else {
      const bx = px + 2, by = py + 6, w = 16, d = 13, h = 17;
      box(bx, by, w, d, h, "#9AA3AD", v < .5 ? "#E6E1D8" : "#D7DEE6");
      rect(bx + 2, by - h + 2, 4, 3, "#7E8893"); rect(bx + 10, by - h + 5, 3, 3, "#7E8893");
      windows(bx, by + d - h + 1.5, w, 5, 4, 2, 1.6, 1.4, v < .5 ? "#7DB3DF" : "#89A9C9");
      for (let k = 0; k < 4; k++) rect(bx + 1, by + d - h + 3.5 + k * 3, w - 2, .6, "rgba(0,0,0,.12)");
    }
  } else if (z === 2){
    const sign = SIGN_C[(v * 5) | 0];
    if (l === 1){
      const bx = px + 3, by = py + 6, w = 14, d = 10, h = 5;
      box(bx, by, w, d, h, "#B9C3CE", "#F5F5F2");
      for (let k = 0; k < 7; k++) rect(bx + k * 2, by + d - h, 2, 2, k & 1 ? "#FFFFFF" : sign);   // awning
      rect(bx + 2, by + d - 2.6, w - 4, 2.6, "#8CC0E8");
    } else if (l === 2){
      const bx = px + 2, by = py + 5, w = 16, d = 12, h = 10;
      box(bx, by, w, d, h, "#A4AFBB", "#7FB2E0");
      for (let k = 1; k < 4; k++) rect(bx + k * 4, by + d - h, .6, h, "rgba(255,255,255,.55)");
      rect(bx, by + d - h + 4.5, w, .8, "rgba(255,255,255,.6)");
      rect(bx + 2, by + d - h, w - 4, 2.4, sign);
    } else {
      const bx = px + 3, by = py + 4, w = 14, d = 14, h = 27;
      box(bx, by, w, d, h, "#4A5868", v < .5 ? "#5D8FC4" : "#4FA3B5");
      for (let k = 0; k < 9; k++) rect(bx, by + d - h + 2 + k * 2.8, w, .7, "rgba(255,255,255,.45)");
      rect(bx + w * .3, by + d - h, .6, h, "rgba(255,255,255,.3)");
      ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.lineWidth = .7; ctx.beginPath(); ctx.arc(bx + w / 2, by - h + d / 2, 3.5, 0, 6.2832); ctx.stroke();
      rect(bx + w - 3, by - h - 5, .8, 5, "#C9CED4");
      if ((T * 2 + v * 3) % 2 < 1) circ(bx + w - 2.6, by - h - 5, .9, "#FF5A4A");
    }
  } else if (z === 3){
    rect(px + 1, py + 1, TS - 2, TS - 2, "#CFC7AE");
    if (l === 1){
      const bx = px + 2, by = py + 6, w = 16, d = 10, h = 5;
      box(bx, by, w, d, h, "#BFAE7E", "#DCCDA4");
      for (let k = 1; k < 8; k++) rect(bx + k * 2, by - h, .6, d, "rgba(0,0,0,.14)");
      rect(bx + 3, by + d - 3.5, 5, 3.5, "#8A7B58"); rect(bx + 10, by + d - 3.5, 4, 3.5, "#8A7B58");
    } else if (l === 2){
      const bx = px + 2, by = py + 6, w = 16, d = 11, h = 7;
      box(bx, by, w, d, h, "#C9B98C", "#B9A47A");
      for (let k = 0; k < 4; k++){ ctx.fillStyle = k & 1 ? "#A99868" : "#DCCFA8"; ctx.beginPath(); ctx.moveTo(bx + k * 4, by - h + d); ctx.lineTo(bx + k * 4 + 4, by - h); ctx.lineTo(bx + k * 4 + 4, by - h + d); ctx.fill(); }
      rect(bx + w - 4, by - h - 7, 3, 9, "#8C5A48"); rect(bx + w - 4, by - h - 6, 3, 1.2, "#EDEDED");
      smoke(bx + w - 2.5, by - h - 8, v, false);
    } else {
      circ(px + 5, py + 13, 3.6, "rgba(0,0,0,.2)"); circ(px + 4.5, py + 12, 3.6, "#E8E8E8"); circ(px + 4.5, py + 12, 2.2, "#D0D4D8");
      const bx = px + 8, by = py + 5, w = 11, d = 12, h = 10;
      box(bx, by, w, d, h, "#B49C6A", "#A88E5E");
      windows(bx, by + d - h + 2, w, 2, 3, 2, 1.5, 2, "#E6D7A6");
      rect(bx + 1, by - h - 12, 3, 14, "#D8DCE0");
      for (let k = 0; k < 3; k++) rect(bx + 1, by - h - 11 + k * 4, 3, 1.6, "#D9473A");
      smoke(bx + 2.5, by - h - 13, v, true);
    }
  }
  if (access && access[i] < 0 && zoom * TS > 10){ circ(px + TS - 4, py + 4, 3, "#E0473A"); rect(px + TS - 4.4, py + 2, .8, 2.4, "#fff"); rect(px + TS - 4.4, py + 5, .8, .8, "#fff"); }
}

function drawCar(c){
  const a = c.path[c.k], b = c.path[Math.min(c.k + 1, c.path.length - 1)];
  const ax = a % W, ay = (a / W) | 0, dx = b % W - ax, dy = ((b / W) | 0) - ay;
  const Ln = G.lanes[c.t < .5 ? a : b] || 2, lw = (TS - 2 * swOf(Ln)) / Ln, li = c.lane % perDir(Ln);
  const off = Ln <= 1 ? 0 : (Ln % 2 ? lw / 2 : 0) + (li + .5) * lw;
  // Thailand: keep left
  const x = (ax + dx * c.t + .5) * TS + dy * off, y = (ay + dy * c.t + .5) * TS - dx * off;
  const hwid = Math.min(2.1, lw * .42);
  ctx.save(); ctx.translate(x, y); ctx.rotate(Math.atan2(dy, dx));
  rrect(-3.4, -hwid + .5, 7.4, hwid * 2, 1.2, "rgba(0,0,0,.25)");
  rrect(-3.8, -hwid, 7.4, hwid * 2, 1.2, c.col);
  rect(.9, -hwid + .4, 1.6, hwid * 2 - .8, "#1E2833");
  rect(-2.8, -hwid + .5, 1, hwid * 2 - 1, "#2A3644");
  rect(-1.8, -hwid + .5, 2.6, hwid * 2 - 1, "rgba(255,255,255,.18)");
  ctx.restore();
}

function draw(){
  T = performance.now() / 1000;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#5E8C44"; ctx.fillRect(0, 0, cv.width, cv.height);
  const s = dpr * zoom;
  ctx.setTransform(s, 0, 0, s, -cam.x * s, -cam.y * s);
  const x0 = clamp(Math.floor(cam.x / TS), 0, W - 1), y0 = clamp(Math.floor(cam.y / TS), 0, H - 1);
  const x1 = clamp(Math.ceil((cam.x + vw / zoom) / TS), 0, W - 1), y1 = clamp(Math.ceil((cam.y + vh / zoom) / TS) + 2, 0, H - 1);
  const {road, zone, bld} = G;

  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) drawGround(y * W + x, x, y);
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++){ const i = y * W + x; if (road[i]) drawRoad(i, x, y); }
  ctx.fillStyle = "#fff"; ctx.font = "bold 11px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (let i = 0; i < N; i++) if (road[i] === 2 && (i % W === 0 || i % W === W - 1)) ctx.fillText(i % W === 0 ? "◀" : "▶", (i % W) * TS + TS / 2, ((i / W) | 0) * TS + TS / 2);
  if (zoom * TS >= 7) for (const c of cars) drawCar(c);
  // buildings & trees, row by row so taller ones overlap the row behind
  const detail = zoom * TS >= 9;
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++){
    const i = y * W + x;
    if (road[i] || terr[i]) continue;
    if (zone[i]){ if (bld[i]) drawBuilding(i, x, y); continue; }
    const v = hash(i, 3);
    if (v < .16 && detail){
      tree(x * TS + 6 + hash(i, 4) * 8, y * TS + 8 + hash(i, 5) * 6, 3.5 + hash(i, 6) * 2.5, v * 6);
      if (v < .06) tree(x * TS + 4 + hash(i, 8) * 12, y * TS + 4 + hash(i, 9) * 8, 3 + v * 20, hash(i, 10));
    }
  }

  // tool preview
  if (!pinch && hover && tool !== "pan"){
    const a = drag && !drag.pan ? drag.start : hover, b = hover;
    const tiles = isLineTool(tool) ? lPath(a, b) : rectTiles(a, b);
    for (const i of tiles){
      const px = (i % W) * TS, py = ((i / W) | 0) * TS;
      if (tool === "road") ctx.fillStyle = terr[i] && !road[i] ? "rgba(170,170,180,.75)" : "rgba(60,64,72,.7)";
      else if (tool === "lane+" || tool === "lane-"){ if (laneTarget(i) == null) continue; ctx.fillStyle = tool === "lane+" ? "rgba(60,140,240,.5)" : "rgba(240,140,40,.5)"; }
      else if (tool === "bull") ctx.fillStyle = "rgba(220,60,50,.4)";
      else { if (road[i] || terr[i]) continue; ctx.fillStyle = LOT[Z[tool]].replace(/[\d.]+\)$/, ".7)"); }
      ctx.fillRect(px, py, TS, TS);
    }
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5;
    ctx.strokeRect(b.x * TS + .75, b.y * TS + .75, TS - 1.5, TS - 1.5);
    if (drag && !drag.pan){
      const cost = toolCost(a, b), label = isLineTool(tool) || tool === "bull" ? `🪙${fmt(cost)}` : `${tiles.length} ช่อง`;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const sx = ((b.x + 1) * TS - cam.x) * zoom + 6, sy = (b.y * TS - cam.y) * zoom - 6;
      ctx.font = "600 13px Anuphan, sans-serif"; ctx.textAlign = "left";
      const w = ctx.measureText(label).width + 12;
      ctx.fillStyle = cost > G.money ? "#C2413A" : "rgba(20,28,36,.85)"; ctx.fillRect(sx, sy - 11, w, 22);
      ctx.fillStyle = "#fff"; ctx.fillText(label, sx + 6, sy);
    }
  }
}

/* ================= main loop ================= */
let last = performance.now(), acc = 0;
function frame(now){
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  if (speed){
    acc += dt * 1000 * speed;
    let guard = 0;
    while (acc >= DAY_MS && guard++ < 4){ acc -= DAY_MS; simDay(); }
    if (acc > DAY_MS) acc = 0;
    // move cars
    for (const c of cars){
      const p = c.path[Math.min(c.k + 1, c.path.length - 1)], l = load[p];
      c.t += dt * speed * 2.6 / (1 + (l > .7 ? 3 * (l - .7) : 0) + (l > 1 ? 4 * (l - 1) : 0));
      while (c.t >= 1 && c.k < c.path.length - 1){ c.t -= 1; c.k++; }
    }
    cars = cars.filter(c => c.k < c.path.length - 1 && G.road[c.path[c.k]]);
  }
  if (netDirty) rebuildNetwork();
  clampCam(); draw();
  requestAnimationFrame(frame);
}

/* ================= boot ================= */
if (!loadGame()) newGame();
addEventListener("resize", resize);
resize(); fitCamera();
rebuildNetwork(); simDay();
setInterval(save, 10000);
document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });
requestAnimationFrame(frame);
</script>
