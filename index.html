<title>เจ้าของสายการบิน</title>

<style>
/* Layout: one-column app shell — sticky status bar, tab panels, fixed bottom nav. Look: airline route-map / flight-strip ops board */
:root{
  --sky:#E8EDF2; --paper:#F8FAFC; --ink:#132235; --muted:#5A6A7D; --line:#CBD5E0;
  --accent:#D47A22; --accent-ink:#FFFFFF; --route:#2A5B9C; --good:#257A4B; --bad:#B93A33; --warn:#B8860B; --grid:#C9D6E3; --sea:#D3E0EC; --land:#F2F4F6; --border:#B9C5D2; --night:rgba(14,28,52,.17); --port:#0E7C86; --cargo:#7B4FD6; --fog:rgba(176,189,204,.86); --plane:#FFFFFF;
  --f-display:"Chakra Petch","Anuphan",system-ui,sans-serif;
  --f-body:"Anuphan","Noto Sans Thai",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sky:#0F1825; --paper:#16233A; --ink:#E5ECF5; --muted:#8D9CB1; --line:#28394F;
  --accent:#EE9B45; --accent-ink:#1A1206; --route:#76A8EA; --good:#4DC48A; --bad:#F27268; --warn:#E3B53F; --grid:#1A283B; --sea:#0B1522; --land:#1B283B; --border:#2E3F57; --night:rgba(0,0,0,.38); --port:#45C6CF; --cargo:#B49BFF; --fog:rgba(5,10,19,.84); --plane:#D9E2EC; color-scheme:dark}}
:root[data-theme="dark"]{
  --sky:#0F1825; --paper:#16233A; --ink:#E5ECF5; --muted:#8D9CB1; --line:#28394F;
  --accent:#EE9B45; --accent-ink:#1A1206; --route:#76A8EA; --good:#4DC48A; --bad:#F27268; --warn:#E3B53F; --grid:#1A283B; --sea:#0B1522; --land:#1B283B; --border:#2E3F57; --night:rgba(0,0,0,.38); --port:#45C6CF; --cargo:#B49BFF; --fog:rgba(5,10,19,.84); --plane:#D9E2EC; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--sky);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* status bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.badge{flex:none;width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;letter-spacing:.04em}
.brand{min-width:0;flex:1}
.brand b{display:block;font-family:var(--f-display);font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{color:var(--muted);font-size:12.5px}
.cash{text-align:right;position:relative}
.cash .v{font-family:var(--f-num);font-weight:600;font-size:16px}
.cash .d{font-size:12px}
.float{position:absolute;right:0;top:-4px;font-family:var(--f-num);font-size:12px;font-weight:600;pointer-events:none;animation:floatup 1.1s ease-out forwards;white-space:nowrap}
@keyframes floatup{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-16px)}}
.clock{display:flex;gap:4px}
.clock button,.qbtn{border:1px solid var(--line);background:var(--sky);border-radius:8px;min-width:36px;height:34px;font-family:var(--f-num);font-size:13px;padding:0 6px}
.clock button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.qbtn{font-family:var(--f-display);font-weight:700;font-size:15px}

main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
main .wrap{padding-block:14px;display:flex;flex-direction:column;gap:14px}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.enter>*{animation:rise .4s cubic-bezier(.2,.7,.2,1) both}
.enter>*:nth-child(2){animation-delay:.05s}.enter>*:nth-child(3){animation-delay:.1s}.enter>*:nth-child(4){animation-delay:.15s}
.enter>*:nth-child(5){animation-delay:.2s}.enter>*:nth-child(n+6){animation-delay:.25s}
.enter .strip{animation:rise .35s cubic-bezier(.2,.7,.2,1) both}
.enter .strip:nth-child(2){animation-delay:.04s}.enter .strip:nth-child(3){animation-delay:.08s}.enter .strip:nth-child(4){animation-delay:.12s}.enter .strip:nth-child(n+5){animation-delay:.16s}
h2{font-family:var(--f-display);font-weight:600;font-size:19px;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:16px;margin:0}
.eyebrow{font-family:var(--f-display);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stats>div{background:var(--paper);padding:10px 12px;min-width:0}
.stats .k{font-size:12px;color:var(--muted)}
.stats .v{font-family:var(--f-num);font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}

.mapbox{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--sea)}
canvas#map{display:block;width:100%;height:360px;touch-action:none;cursor:grab}
canvas#map:active{cursor:grabbing}
.mapctl{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:4px}
.mapctl button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:color-mix(in srgb,var(--paper) 92%,transparent);font-family:var(--f-num);font-weight:600;font-size:18px;display:grid;place-items:center;padding:0}
.mapctl button.on{border-color:var(--accent);color:var(--accent)}
.mapunlock{position:absolute;right:8px;bottom:8px;border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:7px 14px;font-weight:600;font-size:13.5px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.regrow{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.regrow.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.regrow.open{background:var(--sky)}
.ap.lock{opacity:.6}
.aptk{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap}
.aptk.cargo{color:var(--cargo);border-color:color-mix(in srgb,var(--cargo) 45%,transparent)}
.aptk.pax{color:var(--route);border-color:color-mix(in srgb,var(--route) 45%,transparent)}
.mapbox.full .maplegend{white-space:nowrap;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:8px;max-width:calc(100% - 96px)}
.mapbox.full .maplegend::-webkit-scrollbar{display:none}
.fkseg button{flex:1;padding:10px 6px;font-weight:600}
.top .wrap:first-child{padding-block:8px 4px}
.top .row2{padding-block:2px 8px;justify-content:space-between;gap:8px}
.top .row2 .bmode{width:auto;flex:0 1 250px;min-width:0;padding:2px}
.top .row2 .bmode button{height:30px;font-size:13px;padding:0 10px}
.spdc{display:none}
.moreb{position:relative}
.moremenu{position:absolute;right:0;top:calc(100% + 6px);z-index:40;min-width:210px;background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 28px rgba(10,20,40,.22);padding:6px;display:flex;flex-direction:column;gap:2px}
.moremenu[hidden]{display:none}
.moremenu #hubl{display:block!important;white-space:normal;padding:6px 8px 8px;border-bottom:1px solid var(--line);margin-bottom:2px}
.moremenu button{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--ink);text-align:left;padding:9px 8px;border-radius:8px;font-size:14px}
.moremenu button:hover{background:var(--sky)}
.moremenu .mi{width:22px;display:inline-flex;justify-content:center;font-weight:700}
@media (max-width:560px){.top .row2 [data-sp]{display:none}.spdc{display:inline-block}.top .row2 .bmode button{padding:0 6px}}
.pickbtn{width:100%;justify-content:center;border-style:dashed;border-color:color-mix(in srgb,var(--accent) 55%,transparent);color:var(--accent);font-weight:700}
.pt{display:inline-block;font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 7px;vertical-align:1px;white-space:nowrap}
.pt.best{background:color-mix(in srgb,#E9A825 22%,var(--paper));color:#9A6A00}.pt.fast{background:color-mix(in srgb,var(--route) 16%,var(--paper));color:var(--route)}
.picklist{display:flex;flex-direction:column;gap:6px}
.pkrow{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--paper)}
.pkrow.pbest{border-color:#E9A825;box-shadow:0 0 0 1px #E9A825 inset}
.pkart svg{width:72px;height:auto;display:block}.pkr .btn{white-space:nowrap}
.sheet>*{flex-shrink:0}.pkr{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.bmrow{padding-bottom:10px;display:block!important}
.bmode{width:100%}
.bmode{display:flex;gap:4px;padding:3px;border-radius:12px;background:var(--sky);border:1px solid var(--line)}
.bmode button{flex:1;white-space:nowrap;height:34px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-weight:700;font-size:14px}
.bmode button.on{background:var(--route);color:#fff;box-shadow:0 1px 4px rgba(10,20,40,.18)}
.bmode button.on.cg{background:var(--cargo)}
.aptraf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.aptraf>div{background:var(--sky);border-radius:8px;padding:6px 8px;min-width:0}
.aptraf .k{font-size:11.5px;color:var(--muted)}.aptraf .v{font-size:15px;font-weight:700}
#hubl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:440px){#hubl{display:none}.top .clock{margin-left:auto}}
.sbadges{display:flex;flex-wrap:wrap;gap:4px}.sbadges span{font-size:11px;font-weight:600;border:1px solid;border-radius:999px;padding:1px 7px}
.afk{position:fixed;inset:0;z-index:60;background:radial-gradient(120% 90% at 50% 0%,#1B2A44 0%,#0B1220 70%);color:#E8EEF7;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto;animation:popin .25s both}
.afkin{width:min(420px,100%);display:flex;flex-direction:column;gap:12px;align-items:stretch;text-align:center}
.afkz{height:34px;position:relative;font-family:var(--f-display);font-weight:700;color:#8FA3C0}
.afkz span{position:absolute;left:50%;bottom:0;animation:zz 3s infinite both;font-size:14px}.afkz span:nth-child(2){animation-delay:1s;font-size:18px}.afkz span:nth-child(3){animation-delay:2s;font-size:24px}
@keyframes zz{0%{opacity:0;transform:translate(-50%,0)}30%{opacity:1}100%{opacity:0;transform:translate(10px,-26px)}}
@media (prefers-reduced-motion:reduce){.afkz span{animation:none;opacity:.8}}
.afkname{display:flex;gap:8px;align-items:center;justify-content:center;font-size:16px}
.afkcash{font-size:clamp(30px,9vw,44px);font-weight:700;letter-spacing:-.5px;color:#fff}
.afkd{font-size:14px;color:#B8C6DA;margin-top:-6px}.afk .good{color:#5FD08B}.afk .bad{color:#FF7A6B}
.afkgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;text-align:left}
.afkgrid>div{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:8px 10px;min-width:0}
.afkgrid .k{font-size:11.5px;color:#8FA3C0}.afkgrid .v{font-size:14px;font-weight:600;overflow-wrap:anywhere}
.afkspd{display:flex;gap:6px;justify-content:center}
.afkspd button{border:1px solid rgba(255,255,255,.18);background:transparent;color:#E8EEF7;border-radius:8px;min-width:44px;height:36px;font-family:var(--f-num)}
.afkspd button.on{background:#E8EEF7;color:#0B1220}
.afklog{font-size:12.5px;color:#B8C6DA;display:flex;flex-direction:column;gap:3px;min-height:20px}
.afkrule{margin:0;padding:0 0 0 18px;text-align:left;font-size:12px;color:#8FA3C0;line-height:1.55}
.afkx{height:46px;font-size:15px}
.afkdimb{height:46px;background:transparent;color:#E8EEF7;border-color:rgba(255,255,255,.2)}
.afkhint{font-size:11.5px;color:#6F819B}
.afk{transition:background-color 1.2s}
.afkin{transition:opacity 1.2s}
.afksleep{position:absolute;inset:0;margin:auto;height:max-content;display:flex;flex-direction:column;align-items:center;gap:6px;opacity:0;pointer-events:none;transition:opacity 1.2s;z-index:1}
.afkdim #toast,.afkdim .coin,.afkdim .floatcash{display:none!important}
.afkscene{position:absolute;left:0;top:0;width:100vw;height:100vh;height:100dvh;opacity:0;pointer-events:none;transition:opacity 1.6s}
.afk.dim .afkscene{opacity:1}
.afkscene .tw{animation:tw 4s ease-in-out infinite;opacity:.25}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.75}}
.afkscene .tw2{animation:tw 6s ease-in-out infinite}
.afkaur{animation:aur 24s ease-in-out infinite alternate;transform-origin:800px 800px;opacity:.55}
@keyframes aur{0%{transform:translateX(-60px) scaleY(.9);opacity:.35}50%{opacity:.6}100%{transform:translateX(60px) scaleY(1.1);opacity:.45}}
.afkmet{opacity:0;animation:met 13s linear infinite}
@keyframes met{0%,88%{opacity:0;transform:translate(1150px,80px) rotate(155deg)}89%{opacity:1;transform:translate(1150px,80px) rotate(155deg)}96%{opacity:0;transform:translate(820px,240px) rotate(155deg)}100%{opacity:0;transform:translate(820px,240px) rotate(155deg)}}
.afkcity circle{animation:tw 7s ease-in-out infinite}
.afkcolon{animation:colon 2s ease-in-out infinite;display:inline-block;margin:0 .04em}
@keyframes colon{0%,100%{opacity:1}50%{opacity:.25}}
.afksc{position:relative}
.afkplus{position:absolute;left:100%;top:0;margin-left:8px;color:#3C7A55;font-size:13px;opacity:0;white-space:nowrap}
.afkplus.go{animation:plus 2s ease-out}
@keyframes plus{0%{opacity:0;transform:translateY(4px)}20%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
.afk.dim{background:#000}
.afk.dim .afkin{opacity:0;pointer-events:none}
.afk.dim .afksleep{opacity:1}
.afkt{font-family:var(--f-display);font-size:clamp(56px,17vw,104px);font-weight:500;color:#6F84A6;letter-spacing:4px;line-height:1;text-shadow:0 0 28px rgba(110,150,220,.25)}
.afksc{font-size:14px;color:#4A5D7A}
.afkdate{font-size:13px;color:#4F6382;letter-spacing:1px;margin-top:4px}
#spru,#spcid{height:42px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:var(--sky);color:var(--ink);font-size:13px;width:100%}
.afkmusic{pointer-events:auto;margin-top:14px;display:flex;align-items:center;gap:12px;width:min(420px,calc(100vw - 32px));padding:10px 12px;border-radius:16px;background:rgba(20,30,50,.45);border:1px solid rgba(120,150,200,.18);color:#8FA3C0;text-align:left}
.afkmusic[hidden]{display:none}
.afkmusic img,.afkmusic .amart{width:56px;height:56px;border-radius:8px;flex:none;object-fit:cover;opacity:.75;background:#1A2638;display:flex;align-items:center;justify-content:center;font-size:24px}
.afkmusic .amt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.afkmusic .amt b{color:#B7C6DC;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.afkmusic .amt span{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.afkmusic .ambar{height:3px;border-radius:3px;background:rgba(140,165,200,.18);margin-top:4px;overflow:hidden}.afkmusic .ambar i{display:block;height:100%;background:#1DB954;opacity:.7}
.afkmusic .amtime{display:flex;justify-content:space-between;font-size:10.5px;opacity:.7}
.afkmusic .amctl{display:flex;gap:2px}.afkmusic .amctl button{width:36px;height:36px;border:0;border-radius:50%;background:transparent;color:#9FB2CC;font-size:16px}
.afkmusic .amctl button:active{background:rgba(255,255,255,.08)}
.afkmusic .amx{font-size:13px;padding:4px 2px}
.afkevt{font-size:13px;color:#8C7AA8;min-height:18px;text-align:center;padding:0 16px}.afksz{font-size:12px;color:#33445E;margin-top:10px}
@media (prefers-reduced-motion:reduce){.afk,.afkin,.afksleep,.afkscene{transition:none}.afkscene .tw,.afkscene .tw2,.afkaur,.afkcity circle,.afkcolon,.afkplus.go{animation:none}.afkmet{display:none}}
@media (max-width:400px){.clock button,.qbtn{min-width:31px;padding:0 4px}.clock{gap:3px}}
.rankbtn{position:absolute;right:8px;top:var(--barh,8px);z-index:7;height:38px;min-width:36px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:color-mix(in srgb,var(--paper) 94%,transparent);display:flex;align-items:center;gap:4px;font-size:16px;font-weight:700}
.rankbtn .num{font-size:12.5px}
.rankbtn.on{border-color:var(--accent);color:var(--accent)}
.rankpanel{position:absolute;right:54px;top:calc(var(--barh,8px) + 46px);z-index:7;width:min(250px,calc(100% - 70px));background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 26px rgba(10,20,40,.2);padding:10px 12px;display:flex;flex-direction:column;gap:8px;max-height:60%;overflow:auto;animation:popin .18s both}
.rankpanel[hidden]{display:none!important}
.rlist{display:flex;flex-direction:column;gap:2px}
.rk{display:grid;grid-template-columns:20px minmax(0,1fr) 30px auto;gap:6px;align-items:center;font-size:13px;padding:5px 6px;border-radius:8px}
.rk.me{background:color-mix(in srgb,var(--accent) 14%,var(--paper));font-weight:700}
.rkn{color:var(--muted);font-weight:700}.rk:first-child .rkn{color:#E9A825}
.rkname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rkmv{font-size:11px;text-align:center}.rksc{font-size:12.5px}
.rparts{display:flex;flex-direction:column;gap:3px;margin-top:6px}
.mappop{position:absolute;z-index:8;background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(10,20,40,.25);padding:12px;display:flex;flex-direction:column;gap:8px;overflow:auto;overscroll-behavior:contain;animation:popin .18s cubic-bezier(.2,.8,.2,1) both;font-size:14px}
@keyframes popin{from{opacity:0;transform:translateY(6px) scale(.97)}}
.pophead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}

.dgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}

.rrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;font-size:13px}

.mission .bar{height:6px}
.btn.glow{animation:glow 1.4s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 0%,transparent)}}
.coin{position:fixed;z-index:70;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFE58A,#E0A21B 60%,#A86E08);box-shadow:0 1px 2px rgba(0,0,0,.3);pointer-events:none;animation:coin 1s cubic-bezier(.2,.7,.3,1) both}
@keyframes coin{0%{transform:translate(0,0) scale(.4);opacity:1}70%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1);opacity:0}}
.dec{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}

.mapmode button{border:0;background:none;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}

@media (max-width:420px){.mapmode button{padding:6px 8px;font-size:12px}.mapunlock{padding:7px 10px!important;font-size:12.5px!important}}
.brgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.brcard{display:flex;flex-direction:column;gap:8px;background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--route);border-radius:10px;padding:12px;min-width:0}
.brcard.hub{border-left-color:var(--accent)}

.mapbox.full{border:0;border-radius:0}
.mapbox.full canvas#map{height:70vh}
.maphud{position:absolute;left:8px;top:44px;display:flex;flex-direction:column;align-items:flex-start;gap:5px;max-width:calc(100% - 64px);font-size:12.5px;pointer-events:none}
.maphud span{background:color-mix(in srgb,var(--paper) 90%,transparent);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap}
.mapinfo{position:absolute;left:8px;right:8px;bottom:58px;max-width:460px;margin:0 auto}
.mapinfo .apinfo{background:var(--paper);border:1px solid var(--line);box-shadow:0 6px 22px rgba(0,0,0,.18)}
canvas.dchart{display:block;width:100%;height:140px;margin-top:8px}
.dlegend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px}
.dlegend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:3px}
.tagauto{font-size:11px;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:0 6px}
.pick .mini{display:block;width:56px}
.pick button.noreach,.pick button.noreach:disabled{opacity:1;background:var(--sky);border-style:dashed;cursor:not-allowed}
.pick button.noreach .mini,.pick button.noreach>span:nth-child(2)>:not(.rbar):not(.num){opacity:.75}
.rbar{display:inline-block;position:relative;width:96px;height:5px;border-radius:3px;background:var(--grid);margin:6px 8px 0 0;vertical-align:1px}
.rbar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--good)}
.rbar.short i{background:var(--bad)}
.rbar b{position:absolute;top:-3px;width:2px;height:11px;background:var(--ink);transform:translateX(-1px)}
.pick .mini svg.art{width:56px}
.buyhere{border:1px dashed var(--line);border-radius:10px;padding:10px 12px}
.buyhere summary{font-weight:600;color:var(--accent)}
.maplegend{position:absolute;left:8px;top:8px;max-width:calc(100% - 60px);background:color-mix(in srgb,var(--paper) 85%,transparent);padding:3px 8px;border-radius:6px;font-size:11.5px;color:var(--muted);font-family:var(--f-num);display:flex;gap:10px;flex-wrap:wrap}
.maplegend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:0}

.aps{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:6px}
.ap{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 10px;text-align:left;min-width:0;transition:border-color .15s}

.bar{height:8px;border-radius:4px;background:var(--grid);overflow:hidden}

.news{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}

.board{display:flex;flex-direction:column}
.board .r{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:14px}

.board .r.me{font-weight:600}
.board .r.me .nm{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--muted)}
.chip.got{border-color:var(--accent);color:var(--ink);background:color-mix(in srgb,var(--accent) 14%,transparent)}

/* flight strips */
.strips{display:flex;flex-direction:column;gap:8px}
.strip{display:grid;grid-template-columns:76px 1fr auto;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--route);border-radius:8px;padding:10px 12px;text-align:left;width:100%;transition:transform .15s}
.strip:active{transform:scale(.985)}
.strip.loss{border-left-color:var(--bad)}
.strip.idle{border-left-color:var(--muted)}
.strip.shop{border-left-color:var(--warn)}
.strip .fno{font-family:var(--f-num);font-weight:600;font-size:14px}
.strip .fno small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.strip .iata{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.03em}

.strip .right{text-align:right}
.strip .right .num{font-size:14px;font-weight:600}
.lf{height:5px;background:var(--grid);border-radius:3px;margin-top:6px;overflow:hidden;max-width:180px}

.lf.cond i{background:var(--good)}
.lf.cond.mid i{background:var(--warn)}
.lf.cond.low i{background:var(--bad)}

.btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 14px;font-weight:600;transition:transform .12s}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:6px 10px;font-size:13.5px;border-radius:8px}

.models{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.model{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}

svg.art{display:block;width:100%;max-width:340px;height:auto;margin:0 auto}
.hangar{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}

.pcard:active{transform:scale(.98)}
.pcard.idle{border-bottom-color:var(--muted)}.pcard.shop{border-bottom-color:var(--warn)}
.pcard svg.art{margin:-2px 0 0}
.badge svg{display:block}
.dotlv{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.preview{background:linear-gradient(var(--sky),var(--paper));border:1px solid var(--line);border-radius:12px;padding:8px}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid var(--paper);box-shadow:0 0 0 1px var(--line);padding:0}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
.sw.custom{position:relative;display:grid;place-items:center;background:var(--sky);cursor:pointer;font-weight:700;color:var(--muted)}
.sw.custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.pats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.pats button{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:4px 4px 8px;font-size:12.5px;font-weight:600}
.pats button.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent) inset}
.pats .art{width:100%;height:auto}
.logos{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}

.logos button.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.logos .lg{width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.seg.scrollx{overflow-x:auto;scrollbar-width:none}

.model svg.art{margin:-4px 0 2px}

.spec{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;font-size:12.5px;color:var(--muted)}

.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--paper);padding:9px 6px;font-size:14px;transition:background .2s}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--ink);color:var(--paper)}

table.pl{width:100%;border-collapse:collapse;font-size:14px}

canvas#chart{display:block;width:100%;height:150px}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(7,1fr)}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,18,30,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s both}
.sheet{background:var(--paper);width:100%;max-width:640px;max-height:88%;overflow:auto;border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.scrim.anim .sheet{animation:sheetup .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes fade{from{opacity:0}}
@keyframes sheetup{from{transform:translateY(60px);opacity:.4}}
.sheet .x{border:0;background:var(--sky);width:34px;height:34px;border-radius:50%;flex:none}
.pick{display:flex;flex-direction:column;gap:6px}
.pick button{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:10px;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:9px 12px;text-align:left}
.pick button.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.pick button:disabled{opacity:.45}
.pick .iata{font-family:var(--f-display);font-weight:700;font-size:16px}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=text],select{width:100%;font:inherit;color:var(--ink);background:var(--sky);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--muted)}
label.tg{display:flex;align-items:center;gap:10px;font-size:14px}
label.tg input{width:20px;height:20px;accent-color:var(--accent)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv>div{background:var(--sky);border-radius:8px;padding:8px 10px;min-width:0}
.kv .k{font-size:12px;color:var(--muted)}
.kv .v{font-family:var(--f-num);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* guide */
details.g{border-top:1px solid var(--line);padding:10px 0}
details.g:first-of-type{border-top:0}
details.g summary{font-family:var(--f-display);font-weight:600;font-size:15.5px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.g summary::-webkit-details-marker{display:none}
details.g summary::after{content:"+";color:var(--accent);font-family:var(--f-num)}
details.g[open] summary::after{content:"−"}
details.g div{font-size:14px;color:var(--ink);padding-top:8px;max-width:65ch}
details.g p{margin:0 0 8px}
details.g ul{margin:0 0 8px;padding-left:20px}

/* start screen */
.start{display:flex;justify-content:center}
.start .wrap{padding-block:28px 40px;display:flex;flex-direction:column;gap:16px;max-width:560px}
.start h1{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1.15;margin:0;text-wrap:balance}
.start h1 em{font-style:normal;color:var(--accent)}
.ticket{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ticket.print{animation:print .6s cubic-bezier(.3,.7,.2,1) both}
@keyframes print{from{clip-path:inset(0 0 100% 0);transform:translateY(-12px)}to{clip-path:inset(0 0 0 0);transform:none}}
.ticket .tt{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--ink);color:var(--paper);font-family:var(--f-display);font-size:13px;letter-spacing:.1em}
.ticket .tb{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ticket .tb .k{font-size:12px;color:var(--muted)}
.ticket .tb .v{font-family:var(--f-display);font-weight:600;font-size:20px}
.ticket .tb .full{grid-column:1/-1}
.ticket .perf{border-top:2px dashed var(--line)}
.flap{display:inline-flex;gap:3px}
.flap span{display:inline-grid;place-items:center;min-width:1.05em;padding:2px 3px;background:var(--ink);color:var(--paper);border-radius:4px;font-family:var(--f-num);font-weight:600;font-size:22px;line-height:1.2}
.stars{color:var(--accent);letter-spacing:2px}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;max-width:min(92vw,520px);box-shadow:0 6px 24px rgba(0,0,0,.25);transform:translateX(-50%);animation:toastin .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes toastin{from{opacity:0;transform:translate(-50%,14px)}}
.flyover{position:fixed;top:32%;left:0;z-index:60;pointer-events:none;color:var(--accent);animation:fly 1.9s cubic-bezier(.45,0,.25,1) forwards}
.flyover svg{width:84px;height:40px;display:block}
@keyframes fly{from{transform:translate(-120px,50px) rotate(-6deg)}to{transform:translate(calc(100vw + 40px),-70px) rotate(-10deg)}}
.unlock{position:fixed;left:50%;top:40%;z-index:60;background:var(--paper);border:2px solid var(--accent);border-radius:14px;padding:16px 24px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.25);animation:pop 2.8s both;pointer-events:none;max-width:86vw}
.unlock .eyebrow{color:var(--accent)}
.unlock b{display:block;font-family:var(--f-display);font-size:21px;margin-top:2px}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}10%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}16%{transform:translate(-50%,-50%) scale(1)}84%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-70%) scale(.96)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.flyover,.float{display:none}}

function seaPath(A,B){const shut=suezShut(),key=A+B+(shut?"x":"");if(seaCache.has(key))return seaCache.get(key);

function randomEvent(){

  if(k<.15){S.fuel=clamp(S.fuel*1.22,.6,1.9);addNews(`⛽ ราคาน้ำมันพุ่งขึ้นกะทันหัน ดัชนีอยู่ที่ ${S.fuel.toFixed(2)}${S.hedge?" แต่คุณล็อกราคาไว้แล้ว":""}`)}
  else if(k<.26){S.fuel=clamp(S.fuel*.85,.6,1.9);addNews(`⛽ ราคาน้ำมันร่วง ดัชนีอยู่ที่ ${S.fuel.toFixed(2)}`)}
  else if(k<.45){S.events.push({type:"fest",city:c.c,mult:1.6,until:S.day+7});addNews(`🎉 เทศกาลใหญ่ที่${c.n} คนและสินค้าเดินทางเพิ่ม 60% อีก 7 วัน`)}
  else if(k<.59){S.events.push({type:"storm",city:c.c,until:S.day+2});addNews(`🌀 พายุเข้า${c.n} ทุกเที่ยวบินเข้า-ออกงดบิน 2 วัน`)}

    else{const pl=port(rnd(S.lanes.flatMap(l=>[l.from,l.to])));S.events.push({type:"strike",port:pl.c,pmult:.3,until:S.day+4});addNews(`⚓ แรงงานท่าเรือ${pl.n}นัดหยุดงาน 4 วัน ตู้สินค้าลดลง 70%`)}}
  else if(k<.88){const cc=city(rnd(served));S.events.push({type:"cboost",city:cc.c,cmult:1.6,until:S.day+10});addNews(`📦 ความต้องการส่งยาและอุปกรณ์การแพทย์ทางอากาศที่${cc.n}เพิ่ม 60% อีก 10 วัน`)}
  else if(k<.92){const rv=rnd(S.rivals);rv.v*=.9;addNews(`📉 ${rv.n} เจอปัญหาการเงิน มูลค่าลดลง 10%`)}

  if(tab==="cargo")bindCargo();
  $$("[data-claim]").forEach(b=>b.onclick=()=>claimMission(+b.dataset.claim,b));
  $$("[data-go]").forEach(b=>b.onclick=()=>{tab=b.dataset.go;renderView(true)});
  const nr=$("#newr");if(nr)nr.onclick=()=>openSheet(newRouteSheet({from:S.hub,kind:rseg}));
  $$("[data-rseg]").forEach(b=>b.onclick=()=>setBM(b.dataset.rseg));
  const gb=$("#gobranch");if(gb)gb.onclick=()=>{tab="branch";renderView(true);window.scrollTo(0,0)};
  $$("[data-route]").forEach(b=>b.onclick=()=>openSheet(routeSheet(+b.dataset.route,{})));

  $$("[data-scat]").forEach(b=>b.onclick=()=>{scat=b.dataset.scat;renderView()});
  $$("[data-pick]").forEach(b=>b.onclick=()=>openSheet(pickSheet({kind:b.dataset.pick})));
  $$("[data-fk]").forEach(b=>b.onclick=()=>{mktCat=b.dataset.fk==="cargo"?"cargo":"all";setBM(b.dataset.fk)});
  const lvb=$("#livery");if(lvb)lvb.onclick=()=>openSheet(liverySheet({}));
  $$("[data-svc]").forEach(b=>b.onclick=()=>{S.service=+b.dataset.svc;save();renderView();const own=S.routes.filter(r=>r.svc!=null).length;toast(own?`ตั้งค่าเริ่มต้นแล้ว · ${own} เส้นทางที่ตั้งบริการเองไม่เปลี่ยน`:"เปลี่ยนระดับบริการทุกเส้นทางแล้ว")});
  $$("[data-mkt]").forEach(b=>b.onclick=()=>{const m=MKT.find(x=>x.id===b.dataset.mkt);S.cash-=m.cost;S.mkt={n:m.n,mult:m.mult,until:S.day+m.days};S.rep=clamp(S.rep+m.rep,0,100);addNews(`📣 เริ่ม${m.n} ${m.days} วัน`);toast(`เริ่ม${m.n}แล้ว`);save();renderView()});
  const hd=$("#hedge");if(hd)hd.onclick=()=>{const fee=Math.max(5e6,((S.last&&S.last.fuelC)||0)*60*.03);S.cash-=fee;S.hedge={price:+(S.fuel*1.03).toFixed(2),until:S.day+60};addNews(`⛽ ล็อกราคาน้ำมันที่ ${S.hedge.price.toFixed(2)} เป็นเวลา 60 วัน`);save();renderView()};
  const am=$("#amx");if(am)am.onchange=()=>{S.autoMx=am.checked;save()};
  $$("[data-loan]").forEach(b=>b.onclick=()=>{const k=+b.dataset.loan;
    if(k>0){S.loan+=50e6;S.cash+=50e6;addNews("🏦 กู้เงินธนาคาร ฿50 ล้าน")}else{const a=Math.min(50e6,S.loan);S.loan-=a;S.cash-=a;addNews(`🏦 คืนเงินกู้ ${money(a)}`)}save();renderView()});
  const rs=$("#reset");if(rs)rs.onclick=()=>openSheet(resetSheet);

function buy(id){const m=model(id),pr=priceFor(m);if(S.cash<pr)return;
  S.cash-=pr;if(pr<m.price){S.deal=null;toast(`ใช้ดีลลดราคาแล้ว ประหยัด ${money(m.price-pr)}`)}const p={id:S.nid++,m:id,reg:"",route:null,down:0,cond:100,age:0};p.off=(p.id*.37)%1;
  const n=S.fleet.length;p.reg=`HS-${S.code}${"ABCDEFGHJKLMNPQRSTUVWXYZ"[n%24]}${n>=24?Math.floor(n/24):""}`;
  S.fleet.push(p);addNews(`🛬 รับมอบ ${m.name} ทะเบียน ${p.reg}`);toast(`ซื้อ ${m.name} แล้ว · ไปแท็บเส้นทางเพื่อใช้งาน`);flyover();save();renderView();return p}

function openSheet(fn){sheetFn=fn;drawSheet(true)}
function closeSheet(){sheetFn=null;$("#sheet").innerHTML="";if(S)renderView();else renderStart()}
function drawSheet(anim){if(!sheetFn)return;const html=sheetFn();const keep=$(".sheet")?$(".sheet").scrollTop:0;
  $("#sheet").innerHTML=`<div class="scrim ${anim?"anim":""}" id="scrim"><div class="sheet" role="dialog">${html}</div></div>`;
  if(!anim)$(".sheet").scrollTop=keep;
  $("#scrim").onclick=e=>{if(e.target.id==="scrim"&&!(S&&S.over))closeSheet()};
  $$("#sheet [data-x]").forEach(b=>b.onclick=closeSheet);
  sheetFn.bind&&sheetFn.bind()}

     ${S.routes.some(x=>x!==r&&fitsKind(m,x))?`<label class="f">ย้ายไปบินเส้นทาง (เครื่องนี้บินได้ ${m.range.toLocaleString()} กม.)<select id="mv"><option value="">เลือกเส้นทาง</option>${S.routes.filter(x=>x!==r&&fitsKind(m,x)).map(x=>{const dd=rd(x),go=dd<=m.range;return `<option value="${x.id}" ${go?"":"disabled"}>${fno(x)} · ${x.from} → ${x.dest} · ${dd.toLocaleString()} กม.${go?"":" · ไม่สามารถบินได้"}</option>`}).join("")}</select></label>`:""}

  fn.bind=()=>{const p=plane(pid);if(!p)return;const detach=()=>{const r=S.routes.find(x=>x.id===p.route);if(r){r.planes=r.planes.filter(x=>x!==p.id);r.last=null}p.route=null};

function guideSheet(){return head("คู่มือระบบ","ทุกระบบในเกมทำงานอย่างไร")+`<div>
<details class="g" open><summary>เป้าหมายของเกม</summary><div><p>ทำให้มูลค่ากิจการโตจนขึ้นถึงระดับ "ตำนานแห่งท้องฟ้า" และแซงคู่แข่งอีก 3 สายการบินในตารางอันดับ</p><p>มูลค่ากิจการ = เงินสด + มูลค่าขายต่อของฝูงบิน − เงินกู้</p><ul>${GOALS.map(g=>`<li>${g[1]}: ${money(g[0])}</li>`).join("")}</ul></div></details>
<details class="g"><summary>เวลาและความเร็ว</summary><div><p>ที่ความเร็ว 1× เวลาในเกม 1 ชั่วโมงเท่ากับ 1.25 วินาทีจริง (1 วัน = 30 วินาที) เครื่องบินบนแผนที่ใช้เวลาบินตามระยะทางและความเร็วจริงของรุ่น กด 3×, 10× หรือ 30× เพื่อเร่ง กด ❚❚ เพื่อหยุดคิด ระบบคิดรายรับรายจ่ายทุกสิ้นวัน และเซฟอัตโนมัติในเบราว์เซอร์นี้</p></div></details>
<details class="g"><summary>คนอยากบินกี่คน</summary><div><p>แต่ละเส้นทางมีความต้องการผู้โดยสารต่อวัน คำนวณจาก</p><ul><li><b>ขนาดเมือง</b> ทั้งต้นทางและปลายทาง เมืองใหญ่อย่างโตเกียวหรือนิวยอร์กมีคนบินเยอะ</li><li><b>ระยะทาง</b> สั้นกว่า 300 กม. คนนิยมนั่งรถมากกว่า ไกลมากคนก็บินน้อยลง</li><li><b>ราคาตั๋ว</b> ถูกกว่าราคากลางคนเพิ่มขึ้นแรง แพงกว่าคนหายเร็ว</li><li><b>ชื่อเสียง</b> 0–100 ชื่อเสียง 50 คือปกติ</li><li><b>ระดับบริการ</b> การตลาด และเหตุการณ์ เช่น เทศกาลหรือคู่แข่ง</li></ul><p>ผู้โดยสารจริง = น้อยกว่าระหว่างคนอยากบินกับที่นั่งที่มี และมีแกว่งขึ้นลงวันละ ±10%</p></div></details>
<details class="g"><summary>เที่ยวบินต่อวันและที่นั่ง</summary><div><p>เครื่องบินแต่ละลำบินได้วันละหลายเที่ยว ขึ้นกับระยะทางและความเร็ว โดยคิดเวลาบิน + 1.2 ชม. ต่อเที่ยวสำหรับขึ้นลงและเตรียมเครื่อง สูงสุดวันละ 12 เที่ยว</p><p><code>เที่ยว/วัน = 24 ÷ (ระยะทาง ÷ ความเร็ว + 1.2)</code></p><p>ตารางบินแบบ "ปรับตามผู้โดยสาร" (ค่าเริ่มต้น) จะลดเที่ยวบินลงเมื่อคนน้อย ให้แต่ละเที่ยวเต็มราว 85% ส่วน "บินเต็มตาราง" บินทุกเที่ยวเสมอ เหมาะตอนมีเทศกาลหรือแคมเปญ</p><p>เส้นทางสั้นใช้เครื่องลำเล็กคุ้มเพราะบินได้หลายรอบ เส้นทางไกลต้องใช้เครื่องที่พิสัยถึงและจุคนเยอะ ใส่เครื่องหลายลำในเส้นทางเดียวได้</p></div></details>
<details class="g"><summary>ราคาตั๋ว</summary><div><p>หน้าเส้นทางมีกล่องคาดการณ์บอกกำไรหรือขาดทุนต่อวันแบบดูง่าย ปรับราคาด้วยแถบเลื่อนหรือปุ่มลัด (−10%, ราคากลาง, +10%, กำไรสูงสุด) และเลือกบริการแยกเฉพาะเส้นทางได้ ใต้ปุ่มบริการบอกกำไรที่คาดว่าจะได้</p><p>เส้นทางใหม่ใช้ "ราคาอัตโนมัติตามคน" ระบบขึ้นราคาเมื่อคนอยากบินมากกว่าที่นั่ง (เช่น ช่วงเทศกาลหรือแคมเปญ) และลดราคาเมื่อคนน้อย ให้เครื่องเต็มราว 90% กราฟในหน้าเส้นทางแสดงว่าราคาแต่ละระดับมีคนบินกี่คนและได้กำไรเท่าไร จุดสีส้มคือราคาที่กำไรสูงสุด</p><p>ราคากลางคำนวณจากระยะทาง ตั้งได้ตั้งแต่ครึ่งหนึ่งถึงสองเท่าของราคากลาง ถ้าที่นั่งเต็มเกือบ 100% แปลว่าขึ้นราคาได้อีก ถ้าเต็มแค่ครึ่งเดียว ลองลดราคาหรือเปลี่ยนเป็นเครื่องลำเล็กลง หน้าต่างเส้นทางจะคำนวณกำไรให้ดูทันทีที่เลื่อนราคา</p></div></details>
<details class="g"><summary>ขนส่งทางเรือ</summary><div><p>แท็บ "สินค้า" → ทางเรือ เปิดเส้นทางเรือระหว่างท่าเรือ ${PORTS.length} แห่งทั่วโลก (ต้องปลดล็อกภูมิภาคก่อน) แล้วซื้อเรือใส่ เรือวิ่งตามเส้นทางทะเลจริง ผ่านช่องแคบมะละกา คลองสุเอซ คลองปานามา หรืออ้อมแหลม</p><p>เรือแล่นราว 35–41 กม./ชม. เที่ยวยุโรป–เอเชียใช้ราว 2–3 สัปดาห์ในเกม แล้วจอดขนตู้ที่ท่า 1–2 วัน ได้เงินเมื่อเรือถึงท่า ค่าระวางต่อตู้ = ฿2,000 + ฿0.8 ต่อกม. เรือห้องเย็นได้ 1.8 เท่าแต่ตลาดเล็กกว่า เรือ ULCV ต้องใช้ท่าเรือน้ำลึกทั้งสองฝั่ง</p><p>เหตุการณ์: คลองสุเอซปิด (เรืออ้อมแหลมกู๊ดโฮป) และท่าเรือนัดหยุดงาน</p></div></details>
<details class="g"><summary>ขนส่งสินค้า</summary><div><p>เส้นทางแบ่งเป็น 2 แบบ ใช้สาขาเดียวกัน: <b>เส้นทางผู้โดยสาร</b> ใส่ได้เฉพาะเครื่องบินโดยสาร (ขนพัสดุใต้ท้องเครื่องได้ราวครึ่งหนึ่งของตลาด) และ <b>เส้นทางขนสินค้า</b> ใส่ได้เฉพาะเครื่องบินขนสินค้า เลขเที่ยวบินขึ้นต้น 8xx เส้นบนแผนที่เป็นสีม่วง เปิดทั้งสองแบบไปเมืองเดียวกันได้</p><p>มีเครื่องขนสินค้า 7 รุ่น ตั้งแต่ ATR 72F (8 ตัน) ถึง 747-8F (135 ตัน) แต่ละเส้นทางตั้งค่าระวางได้เองหรือให้ระบบตั้งอัตโนมัติ ช่วงฤดูผลไม้ไทย ช้อปปิ้ง 11.11 และปลายปี สินค้าจะเยอะขึ้น ดูปฏิทินได้ในแท็บ "สินค้า"</p><p>ทุกเที่ยวบินขนสินค้าใต้ท้องเครื่องได้ ส่วน Boeing 777F ขนสินค้าอย่างเดียว 100 ตันต่อเที่ยว รายได้สินค้าคิด ฿${CARGO_RATE} ต่อตันต่อกิโลเมตร ความต้องการสินค้าขึ้นกับขนาดเมืองและระยะทาง สินค้าไม่สนราคาตั๋วหรือชื่อเสียง</p></div></details>
<details class="g"><summary>เงินเข้าออกตอนไหน</summary><div><p>ทุกครั้งที่เครื่องบินลงจอด คุณได้ค่าตั๋วและค่าขนสินค้าของเที่ยวนั้นทันที และจ่ายค่าน้ำมัน ค่าสนามบิน และค่าบริการบนเครื่องของเที่ยวนั้นไปพร้อมกัน ตัวเลขเขียวหรือแดงจะลอยขึ้นจากสนามบินที่ลงจอดบนแผนที่</p><p>ตอนเที่ยงคืนระบบหักค่าใช้จ่ายคงที่ ได้แก่ ค่าดูแลเครื่องบิน ค่าลูกเรือ และดอกเบี้ย แล้วสรุปเป็นงบเมื่อวานในแท็บการเงิน</p></div></details>
<details class="g"><summary>ต้นทุน</summary><div><ul><li><b>ค่าน้ำมัน</b> = จำนวนเที่ยว × ระยะทาง × ค่าบินต่อกม.ของรุ่น × ดัชนีน้ำมัน</li><li><b>ค่าสนามบิน</b> แต่ละเมืองเก็บไม่เท่ากัน ลอนดอนและนิวยอร์กแพงสุด คิดตามขนาดเครื่อง</li><li><b>ค่าดูแลเครื่องและลูกเรือ</b> 0.12% ของราคาเครื่องต่อวัน ถ้าจอดว่างเหลือ 0.06%</li><li><b>ค่าบริการ</b> ต่อผู้โดยสาร ตามระดับบริการ</li><li><b>ดอกเบี้ย</b> เงินกู้ 0.02% ต่อวัน</li></ul></div></details>
<details class="g"><summary>สภาพเครื่องและการซ่อมบำรุง</summary><div><p>ทุกเที่ยวที่บิน สภาพเครื่องลดลง 0.035% เครื่องที่สภาพต่ำมีโอกาสขัดข้องกลางทาง ต้องจอด 3 วัน เสียเงินและชื่อเสียง ถ้าสภาพเฉลี่ยของฝูงบินต่ำกว่า 60% ชื่อเสียงจะค่อย ๆ ลด</p><p>ส่งซ่อมบำรุงได้เองหรือเปิดโหมดอัตโนมัติ ใช้เวลา 2 วันแล้วสภาพกลับเป็น 100% ราคาขายต่อลดลงตามอายุและสภาพเครื่อง</p></div></details>
<details class="g"><summary>ชื่อเสียงและระดับบริการ</summary><div><p>ชื่อเสียงจะค่อย ๆ เคลื่อนเข้าหาค่าเป้าหมายของระดับบริการ ประหยัด 35 มาตรฐาน 60 พรีเมียม 85 คลิปไวรัลและแคมเปญใหญ่ช่วยดันขึ้น เครื่องเสียกลางทางทำให้ลดลง</p></div></details>
<details class="g"><summary>การตลาดและล็อกราคาน้ำมัน</summary><div><p>แคมเปญการตลาดเพิ่มคนบินทุกเส้นทางชั่วคราว เปิดได้ทีละแคมเปญ</p><p>ดัชนีน้ำมันขึ้นลงทุกวันและพุ่งแรงได้จากเหตุการณ์ การล็อกราคาจะตรึงดัชนีไว้ 60 วัน ค่าธรรมเนียมประมาณ 3% ของค่าน้ำมันช่วงนั้น เหมาะตอนน้ำมันถูก</p></div></details>
<details class="g"><summary>เงินกู้และการล้มละลาย</summary><div><p>กู้ได้ทีละ ฿50 ล้าน วงเงินขึ้นกับมูลค่าฝูงบิน ถ้าเงินสดติดลบต่อเนื่อง 30 วัน สายการบินล้มละลายและต้องเริ่มชะตาใหม่</p></div></details>
<details class="g"><summary>✨ โบนัส: ลูกค้าพิเศษ รางวัลรายวัน และเลเวล</summary><div><ul><li>🎫/📦 ฟองลูกค้าพิเศษจะเด้งขึ้นที่สนามบินของคุณบนแผนที่เป็นระยะ แตะก่อนวงเวลาหมดเพื่อรับเงินโบนัส บางครั้งเป็น 🌟 ลูกค้าทองคำ ได้ 5 เท่า</li><li>🎁 เข้าเกมทุกวัน (วันจริง) รับรางวัลรายวัน ต่อเนื่องครบ 7 วันได้ก้อนใหญ่</li><li>Lv ข้างชื่อสายการบินคือเลเวล คิดจากคะแนนการแข่งขัน ขึ้นเลเวลแต่ละครั้งได้โบนัส แถบเล็กใต้ Lv บอกว่าใกล้เลเวลถัดไปแค่ไหน</li></ul></div></details>
<details class="g"><summary>🧭 ช่วยเลือกเครื่องบินและเรือ</summary><div><p>ไม่รู้จะซื้อรุ่นไหน ให้กดปุ่ม 🧭 ในแท็บฝูงบินหรือแท็บสินค้า หรือกด "ดูทุกรุ่น" ในกล่องเพิ่มเครื่องบิน/เรือบนแผนที่ เลือกเส้นทาง แล้วเกมจะเรียงทุกรุ่นตามกำไรต่อวันที่จะเพิ่มขึ้น</p><ul><li>⭐ คุ้มที่สุด: ทำกำไรเพิ่มได้มากที่สุด</li><li>⚡ คืนทุนเร็วสุด: ราคาซื้อคืนกลับมาเร็วที่สุด</li><li>รุ่นที่บินไม่ถึง หรือเทียบท่าไม่ได้ จะแยกไว้ด้านล่างพร้อมบอกเหตุผล</li></ul><p>ชนิดเรือ: 📦 ตู้คอนเทนเนอร์ ขนสินค้าทั่วไป · ❄ ห้องเย็น ขนผลไม้และอาหาร ค่าระวาง 1.8 เท่า · 🚗 ขนรถ ค่าระวาง 1.5 เท่า แต่ละชนิดมีสินค้าของตัวเอง เรือต่างชนิดเลยไม่แย่งสินค้ากันบนเส้นทางเดียวกัน</p><p>บนแผนที่ กดปุ่มลูกศรที่มุมแถบด้านบนเพื่อย่อแถบให้เหลือแค่ชื่อกับเงิน</p></div></details>
<details class="g"><summary>โหมดคน และ โหมดสินค้า</summary><div><p>ปุ่มใต้แถบด้านบนสลับทั้งเกมระหว่าง 2 โหมด</p><ul><li>👥 โหมดคน: แผนที่ เส้นทาง ฝูงบิน และกล่องข้อมูลสนามบิน แสดงเฉพาะเครื่องบินโดยสารและเส้นทางผู้โดยสาร ป้ายบนแผนที่บอกจำนวนคนขึ้นเครื่อง</li><li>📦 โหมดสินค้า: แสดงเฉพาะเครื่องบินขนสินค้า เส้นทางสินค้า และเรือ ป้ายบนแผนที่บอกสินค้าเป็นตัน กดสนามบินแล้ว + เพิ่มเครื่องบิน จะขึ้นเฉพาะเครื่องขนสินค้า</li></ul><p>เงิน สาขา และเวลาใช้ร่วมกันทั้ง 2 โหมด เครื่องบินทุกลำยังบินและทำเงินตลอด ไม่ว่าจะเปิดโหมดไหน</p></div></details>
<details class="g"><summary>ประเภทสนามบิน</summary><div><ul><li>✈📦 สนามบินส่วนใหญ่รับทั้งผู้โดยสารและสินค้า</li><li>✈ สนามบินเล็กเมืองท่องเที่ยว เช่น สมุย ฟูก๊วก ควีนส์ทาวน์ รับเฉพาะผู้โดยสาร</li><li>📦 ฮับสินค้า เช่น เมมฟิส หลุยส์วิลล์ ลีแยฌ ไลพ์ซิก เออโจว ดูไบเวิลด์เซ็นทรัล รับเฉพาะสินค้า (จุดสี่เหลี่ยมสีม่วงบนแผนที่)</li></ul><p>ป้าย 👥 บนแผนที่ข้างสนามบินของคุณคือจำนวนคนที่ขึ้นเครื่องที่นั่นวันนี้ แตะสนามบินเพื่อดูคนขึ้น คนลง และสินค้าเข้าออก เทียบกับเมื่อวาน</p></div></details>
<details class="g"><summary>โหมด AFK และรายได้ตอนไม่อยู่</summary><div><p>กดปุ่ม 💤 บนแถบด้านบนเพื่อเข้าโหมด AFK เกมจะเดินต่อเอง ตัดสินใจเหตุการณ์แบบปลอดภัย และรับรางวัลภารกิจให้ โดยไม่วาดแผนที่เพื่อประหยัดแบต</p><p>ถ้าไม่แตะจอ 10 วินาที (หรือกด 🌙 หรี่จอเลย) จอจะมืดเหมือนโหมดนอนหลับ เหลือแค่นาฬิกาจางๆ กับเงิน แตะจอครั้งเดียวเพื่อปลุก</p><p>ถ้าปิดเกมหรือสลับไปแอปอื่นเกิน 2 นาที กลับมาจะได้รายได้ตามกำไรเฉลี่ย 7 วันล่าสุด</p><ul><li>ปกติ: 12 วันของกำไรต่อชั่วโมง สูงสุด 8 ชม.</li><li>เปิด AFK ไว้ก่อนออก: 24 วันต่อชั่วโมง สูงสุด 12 ชม.</li><li>ถ้ากำไรเฉลี่ยติดลบจะไม่ได้รายได้ แต่ก็ไม่หักเงิน</li><li>เวลาในเกมไม่เดินระหว่างที่ไม่อยู่</li></ul></div></details>
<details class="g"><summary>การแข่งขันและคะแนน</summary><div><p>แข่งกับสายการบินคู่แข่ง 5 เจ้าด้วยคะแนนรวม ดูได้จากปุ่ม 🏆 มุมขวาบนของแผนที่ หรือในหน้าภาพรวม</p><ul><li>มูลค่ากิจการ 1 คะแนนต่อ ฿2 ล้าน</li><li>ผู้โดยสารสะสม 1 คะแนนต่อ 100 คน</li><li>สินค้าทางอากาศ 1 คะแนนต่อ 2 ตัน</li><li>ตู้ทางเรือ 1 คะแนนต่อ 10 TEU</li><li>เรตติ้ง 1,000 คะแนนต่อดาว</li><li>ภารกิจ 300 คะแนนต่อภารกิจ</li></ul><p>ลูกศร ▲▼ บอกว่าอันดับเปลี่ยนไปเท่าไรจากเมื่อวาน</p></div></details>
<details class="g"><summary>เรตติ้ง 5 ดาว</summary><div><p>เรตติ้งโดยรวมคือค่าเฉลี่ยของ 4 ด้านที่เริ่มทำแล้ว:</p><ul><li><b>สายการบิน</b> จำนวนปลายทาง ที่นั่งเต็มใกล้ 85% สภาพเครื่อง และสัดส่วนเส้นทางที่มีกำไร</li><li><b>การเดินเรือ</b> ตู้เต็ม เส้นทางเรือที่มีกำไร ขนาดกองเรือ และระดับสาขาท่าเรือ</li><li><b>สินค้าทางอากาศ</b> ระวางเต็ม ปริมาณสินค้า และจำนวนเครื่องขนสินค้า</li><li><b>ความพอใจของผู้โดยสาร</b> ชื่อเสียง ระดับบริการ ความคุ้มค่าของราคาตั๋ว ความแออัด และเหตุเครื่องขัดข้อง</li></ul><p>เรตติ้งคำนวณใหม่ทุกวัน 0 ดาวทำให้ผู้โดยสารลด 10% ส่วน 5 ดาวเพิ่ม 10% คู่แข่งก็มีเรตติ้งในตารางอันดับ</p></div></details>
<details class="g"><summary>ภารกิจและการตัดสินใจ</summary><div><p>หน้าภาพรวมมีภารกิจ 3 อย่างเสมอ ทำสำเร็จแล้วกดรับรางวัลเป็นเงินและชื่อเสียง บางภารกิจมีเวลาจำกัด ทุก 1–2 สัปดาห์ในเกมจะมีเรื่องให้ตัดสินใจ เช่น งานเหมาลำ สหภาพลูกเรือ ดีลลดราคาเครื่องบิน หรือโค้ดแชร์ เกมจะหยุดรอจนกว่าคุณเลือก</p></div></details>
<details class="g"><summary>สาขา</summary><div><p>สาขาท่าเรือทำงานแบบเดียวกับสาขาสนามบิน เรือต้องออกจากสาขาท่าเรือของคุณ อัปเกรดแล้วตู้สินค้าเพิ่ม 8% และค่าท่าเรือลด 15% ต่อระดับ</p><p>ทุกเส้นทางต้องออกจากสาขา เปิดสาขาได้ที่สนามบินใดก็ได้ในภูมิภาคที่ปลดล็อกแล้ว ในแท็บ "สาขา" หรือแตะสนามบินบนแผนที่ ราคาสาขาขึ้นกับขนาดเมือง และแพงขึ้น 30% ต่อสาขาที่มีอยู่</p><p>แต่ละสาขามีค่าดูแลรายวัน (สำนักงานใหญ่ฟรี) อัปเกรดได้ถึงระดับ 3 แต่ละระดับเพิ่มผู้โดยสาร 8% และลดค่าสนามบิน 15% ของทุกเส้นทางที่บินเข้าออกสนามบินนั้น แต่ค่าดูแลก็เพิ่มตามระดับ</p></div></details>
<details class="g"><summary>แผนที่และการปลดล็อก</summary><div><p>โลกแบ่งเป็น 9 ภูมิภาค มีสนามบินทั้งหมด ${CITIES.length} แห่ง เริ่มเกมคุณเห็นแค่ภูมิภาคของเมืองฐาน ที่เหลือถูกหมอกบัง เปิดเส้นทางหรือตั้งฐานได้เฉพาะเมืองในภูมิภาคที่ปลดล็อกแล้ว แตะป้าย 🔒 บนแผนที่หรือปุ่ม "ปลดล็อกแผนที่" เพื่อจ่ายเงินปลดล็อก ราคาขึ้นกับระยะทางจากฐานแรก</p><p>แท็บ "แผนที่" เปิดแผนที่ใหญ่เต็มจอ หรือกดปุ่มขยายมุมแผนที่ในหน้าภาพรวม ลากเพื่อเลื่อนแผนที่ บีบสองนิ้วหรือกด + − เพื่อซูม ปุ่มลูกโลกดูทั้งโลก ปุ่มเป้าซูมไปที่เส้นทางของคุณ</p><p>แผนที่ใช้แนวชายฝั่งและพรมแดนจริงจาก Natural Earth เส้นทางบินวาดตามเส้นวงกลมใหญ่ (great circle) แบบที่เครื่องบินจริงใช้ เส้นทางไกลจึงโค้งขึ้นไปทางขั้วโลก เงาสีเข้มคือด้านกลางคืนของโลก คำนวณจากเวลาในเกมและฤดูกาล</p></div></details>
<details class="g"><summary>เหตุการณ์สุ่ม</summary><div><ul><li>เทศกาล: คนและสินค้าเพิ่ม 60% 7 วัน</li><li>พายุ: งดบินเข้าออกเมืองนั้น 2 วัน แต่ค่าดูแลเครื่องยังเดิน</li><li>คู่แข่งเปิดเส้นทาง: คนลด 25% 30 วัน</li><li>น้ำมันพุ่งหรือร่วง, คลิปไวรัล, นกชนเครื่อง, คู่แข่งมีปัญหาการเงิน</li></ul><p>เมืองที่มีเหตุการณ์จะมีวงสีกระพริบบนแผนที่</p></div></details>
</div>`}

/* ---------- map (real geography: Natural Earth 1:50m via world-atlas) ---------- */
function cssv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
const RINGS=GEO.L.map(a=>{const p=new Float32Array(a.length);let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for(let i=0;i<a.length;i+=2){const x=a[i]/10,y=a[i+1]/10;p[i]=x;p[i+1]=y;if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}return {p,x0,x1,y0,y1}});
const BORDERS=GEO.B.map(a=>{const p=new Float32Array(a.length);let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for(let i=0;i<a.length;i+=2){const x=a[i]/10,y=a[i+1]/10;p[i]=x;p[i+1]=y;if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}return {p,x0,x1,y0,y1}});
const ulon=lon=>{const h=city(S.hub).lon;let l=lon;while(l-h>180)l-=360;while(l-h<-180)l+=360;return l};
const gcCache=new Map();
// Route line on the map: a straight line between the two airports (shortest way round) — the gentle bow is added when drawing.
// A true great circle loops far north on a flat map for long flights, which looked odd.
function gcPath(a,b){const key="f"+S.hub+a.c+b.c;if(gcCache.has(key))return gcCache.get(key);
  {const l0=ulon(a.lon);let l1=ulon(b.lon);while(l1-l0>180)l1-=360;while(l1-l0<-180)l1+=360;const pts=[];for(let i=0;i<=48;i++){const t=i/48;pts.push([l0+(l1-l0)*t,a.lat+(b.lat-a.lat)*t])}gcCache.set(key,pts);return pts}
  const r=Math.PI/180,toV=c=>[Math.cos(c.lat*r)*Math.cos(c.lon*r),Math.cos(c.lat*r)*Math.sin(c.lon*r),Math.sin(c.lat*r)];
  const A=toV(a),B=toV(b),om=Math.acos(clamp(A[0]*B[0]+A[1]*B[1]+A[2]*B[2],-1,1)),s=Math.sin(om)||1,n=64,pts=[];
  let prev=ulon(a.lon);
  for(let i=0;i<=n;i++){const t=i/n,f1=Math.sin((1-t)*om)/s,f2=Math.sin(t*om)/s,v=[f1*A[0]+f2*B[0],f1*A[1]+f2*B[1],f1*A[2]+f2*B[2]];
    const lat=Math.atan2(v[2],Math.hypot(v[0],v[1]))/r;let lon=Math.atan2(v[1],v[0])/r;

/* ---------- loop ---------- */
function frame(now){
  const dt=Math.min(250,now-lastTick);lastTick=now;
  if(S&&!S.over&&!paused){acc+=dt*speed;

      if(!sheetFn){if(tab==="home")refreshHome();else if(tab==="map")refreshMapTab();else renderView()}
      updateTop();if(S.over){showOver();break}}}
  if(S&&!S.over&&!paused){settleFlights(S.day+acc/DAY_MS);settleShips(S.day+acc/DAY_MS)}
  if(S&&!S.over&&now-(frame.mc||0)>1200){frame.mc=now;checkMissions();lvlCheck();pickSpawn();dailyCheck();const rn=$("#rankno");if(rn){rn.textContent="#"+rank();const rp=$("#rankpanel");if(rp&&!rp.hidden&&!rp.querySelector("details[open]"))rp.innerHTML=rankPanelHTML()}}

  if(S&&afk&&now-(frame.ak||0)>500){frame.ak=now;afkTick()}
  if(S&&now-(frame.sn||0)>10000){frame.sn=now;S.seen=Date.now();save()}
  if(S&&pendingDec&&!sheetFn&&!S.over){const d=pendingDec;pendingDec=null;openDecision(d)}
  if(S&&tab==="money"&&!sheetFn&&now-(frame.lt||0)>400){frame.lt=now;const tp=$("#todayp");if(tp)tp.innerHTML=todayHTML()}
  if(S){animDay=S.day+acc/DAY_MS;if(!afk&&(tab==="home"||tab==="map")&&$("#map")&&now-(frame.dm||0)>=31){frame.dm=now;drawMap()}
    if(tab==="map"&&now-(frame.hl||0)>500){frame.hl=now;const hd=$("#maphud");if(hd)hd.innerHTML=mapHudHTML()}
    const dt2=$("#dt");if(dt2){const mins=Math.floor((acc/DAY_MS)*1440/5)*5,tx=`วันที่ ${S.day+1} · ${dateOf(S.day)} · ${String(mins/60|0).padStart(2,"0")}:${String(mins%60).padStart(2,"0")} น.`;if(dt2.textContent!==tx)dt2.textContent=tx}
